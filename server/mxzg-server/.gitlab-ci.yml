stages:
  - build-hk
  - build-kor
  - build-jpn
  - build-sea
#  - build-cn

# hk
build-hk-job:
  stage: build-hk
  tags:
    - mxzg-server
  script:
    - mvn clean package -Dmaven.test.skip=true
    - sh /home/mxzg/test-gameserver/build_script/new_script/update-jar.sh hk
    - sh /home/mxzg/test-gameserver/build_script/new_script/update-config.sh hk
    - sh /home/mxzg/test-gameserver/build_script/new_script/rsync-to-dev-server.sh
  only:
    - master

