<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
<meta name="keywords" content="webuploader">
<meta name="description" content="webuploader">
<meta name="author" content="镭拓科技">
<title>webuploader</title>
 <link rel="stylesheet" type="text/css" href="/public/webuploader/webuploader.css">
<!-- js脚本文件 -->
<script src="/public/static/admin/js/jquery.min.js?v=2.1.4"></script>
<script type="text/javascript" src="/public/webuploader/webuploader.nolog.js"></script>
</head>
<body>
    <div id="uploader-demo">
    <!--用来存放item-->
    <div id="fileList" class="uploader-list"></div>
    <div id="filePicker">选择图片</div>
</div>
<script>
// 初始化Web Uploader
var uploader = WebUploader.create({
    
    // 选完文件后，是否自动上传。
    auto: true,

    // swf文件路径
    swf: '/public/webuploader/Uploader.swf',

    // 文件接收服务端。
    server: '/index.php/Admin/Upload/fileupload.html',

    // 选择文件的按钮。可选。
    // 内部根据当前运行是创建，可能是input元素，也可能是flash.
    pick: '#filePicker',

    // 只允许选择图片文件。
    accept: {
        title: 'Images',
        extensions: 'gif,jpg,jpeg,bmp,png',
        mimeTypes: 'image/*'
    }
});
</script>

</body>
</html>
