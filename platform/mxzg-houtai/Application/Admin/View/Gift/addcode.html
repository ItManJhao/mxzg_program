<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>追加兑换码</h5>
                </div>
                <div class="ibox-content">

                    <div class="row">

                        <form action="{:U('gift/ajax_add_code')}" method="post" id="artkindFrom" class="form-horizontal">
                            <div class="tab-content">
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>追加标识：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="mark" type="text" required="" aria-required="true">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>追加数量：</label>
                                    <div class="col-sm-8">
                                        <input style="width: 150px;" class="configInput form-control" name="add_num" type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,'')" required="" aria-required="true">
                                    </div>
                                </div>

                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="gift_id" value="{$gift_id}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('gift/ajax_add_code')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div> 
<script language="javascript">


</script>


<include file="Public:footer" />
