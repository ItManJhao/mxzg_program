<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>编辑邮件</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('mail/ajax_updata')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                        <div class="tab-pane active">

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>邮件发送类型：</label>
                                <input type="hidden" name="type" value="{$mail_info.type}">
                                <div class="col-sm-8">
                                    <select class="form-control server-type" name="type" disabled>
                                        <option value="2" <if condition="$mail_info['type'] == 2"> selected </if>>单服发送</option>
                                        <option value="1" <if condition="$mail_info['type'] == 1"> selected </if>>全服发送</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group all-server">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>区服：</label>
                                <div class="col-sm-8">
                                    <volist name="server_list" id="server_list_vo">
                                        <div class="check-servers">
                                            <div class="checkbox">
                                                <label>
                                                    <input style="width: 21px;height: 21px;" class="check-all" type="checkbox" >
                                                    全选
                                                </label>
                                            </div>
                                            <div class="checkbox checkbox-inline">
                                                <volist name="server_list_vo" id="server_list_vo_vo">
                                                    <label>
                                                        <input style="width: 21px;height: 21px;" type="checkbox" class="server-check" name="server_ids[]" value="{$server_list_vo_vo['id']}"  <if condition="in_array($server_list_vo_vo['id'], $mail_info['sid'])"> checked  </if>>
                                                        {$server_list_vo_vo['server_name']}
                                                    </label>
                                                </volist>
                                            </div>
                                        </div>
                                    </volist>
                                </div>
                            </div>
                            <div class="form-group only-server">
                                <label class="col-sm-2 control-label">区服：</label>
                                <div class="col-sm-8">
                                    <select class="form-control" name="sid">
                                        <volist name="server_only" id="server_only_vo">
                                            <eq name="server_only_vo.id" value="$mail_info['sid'][0]">
                                                <option value="{$server_only_vo.id}" selected>{$server_only_vo.id}--{$server_only_vo.server_name}</option>
                                                <else />
                                                <option value="{$server_only_vo.id}">{$server_only_vo.id}--{$server_only_vo.server_name}</option>
                                            </eq>
                                        </volist>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="form-group only-server">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>角色id集合：</label>
                                <div class="col-sm-8">
                                    <textarea placeholder="角色id" name="role_ids" class="configInput form-control" required="" aria-required="true">{$mail_info.role_ids}</textarea>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label">邮件模板：</label>
                                <div class="col-sm-8">
                                    <select class="form-control" name="mail_template_id" onchange="upmail(this)">
                                        <volist name="mail_templates" id="mail_templates_vo" >
                                            <eq name="mail_templates_vo.id" value="$mail_info.mail_template_id">
                                                <option value="{$mail_templates_vo.id}" selected>{$mail_templates_vo.title}</option>
                                                <else />
                                                <option value="{$mail_templates_vo.id}">{$mail_templates_vo.title}</option>
                                            </eq>
                                        </volist>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>标题：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control title" name="title" value="{$mail_info.title}" type="text" required="" aria-required="true">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>内容：</label>
                                <div class="col-sm-8">
                                    <textarea placeholder="请输入内容" name="content" class="configInput form-control content" required="" aria-required="true">{$mail_info.content}</textarea>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label">选择道具：</label>
                                <div class="col-sm-8 class-item  item-fuzhi">
                                    <a class="add_item"><i class="fa fa-plus"></i>添加道具</a>
                                    <p></p>
                                    <volist name="gift_item_data" id="gift_item_data_vo">
                                        <div class="col-sm-10">
                                            <a style="width: 80px; float: left;" class="del_item"><i class="fa fa-minus-square"></i>删除道具</a>
                                            
                                            <input type="hidden" name="item_type[]" value="{$gift_item_data_vo.item_type}">
                                            <select class="selectpicker form-control item_type" data-style="btn-info" data-title="请选择道具" data-live-search="true" >
                                                <volist name="item_data" id="item_data_vo">
                                                    <eq name="item_data_vo.id" value="$gift_item_data_vo.item_type">
                                                        <option value="{$item_data_vo.id}" selected>{$item_data_vo.id}--{$item_data_vo.name}</option>
                                                        <else />
                                                        <option value="{$item_data_vo.id}">{$item_data_vo.id}--{$item_data_vo.name}</option>
                                                    </eq>
                                                </volist>
                                            </select>
                                            <input style="width: 90px; float: left;" class="configInput form-control" name="gift_item_num[]" value="{$gift_item_data_vo.item_num}" type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,"")">
                                        
                                        </div>
                                    </volist>
                                </div>
                            </div>


                        </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="id" value="{$mail_info.id}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('mail/ajax_updata')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>
<!-- <script src="/Public/static/admin/js/item.js"></script> -->
<script language="javascript">

    var data_str = '<?php echo json_encode($item_data); ?>';
    data_object = JSON.parse(data_str);

    var mail_templates_str = '<?php echo json_encode($mail_templates); ?>';
    mail_templates_str = mail_templates_str.replace(/\n/g,"\\n").replace(/\r/g,"\\r");
    mail_templates_object = JSON.parse(mail_templates_str);
    

    $ (function () {
        serverType($('.server-type'));

        $(document).on('change', ".item_type", function(e){
            var sid_str = '';
            $(this).find("option:selected").each(function () {
                sid_str += $(this).val() + ",";
            })
            if(sid_str != ''){
                sid_str = sid_str.slice(0,-1);
            }
            $(this).parent().prev().val(sid_str);
            // doMultipleSelection(this, 'product_id');
        })

        $(document).on('click', '.add_item', function() {
            var htmladd="";
            htmladd +='<div class="col-sm-10">';
            htmladd +='<a style="width: 80px; float: left;" class="del_item"><i class="fa fa-minus-square"></i>删除道具</a>';
            htmladd +='<input type="hidden" name="item_type[]" value="">';
            htmladd +='<select class="selectpicker form-control item_type" data-style="btn-info" data-title="请选择道具" data-live-search="true">';
            htmladd +='<volist name="item_data" id="item_data_vo">';
            htmladd +='<option value="{$item_data_vo.id}">{$item_data_vo.id}--{$item_data_vo.name}</option>';
            htmladd +='</volist></select>';
            htmladd +='<input style="width: 90px; float: left;" class="configInput form-control" name="gift_item_num[]" type="number" min="1" onkeyup="this.value=value.replace(/^(0+)|[^\d]+/g,"")">';
            htmladd +='</div>';
            $('.class-item').append(htmladd);
            $('.item_type').selectpicker('refresh');
            // upitem($('.item_type_type:last'));
        });
        $(document).on('click', '.del_item', function() {
            $(this).parent().remove();
        });
    });

    function upmail(obj){
        // //获取所选值
        var selectedValue = $(obj).val();
        // console.log(selectedValue);
        // console.log(mail_templates_object[selectedValue]);
        $(".title").val(mail_templates_object[selectedValue].title);
        $(".content").val(mail_templates_object[selectedValue].content);

        var item_html = "";
        item_html = '<a class="add_item"><i class="fa fa-plus"></i>添加道具</a><p></p>';
        $.each(mail_templates_object[selectedValue].item_data, function (key, item) {
            // console.log(key);
            // console.log(item);
            item_html +='<div class="col-sm-10">';
            item_html +='<a style="width: 80px; float: left;" class="del_item"><i class="fa fa-minus-square"></i>删除道具</a>';
            item_html +='<input type="hidden" name="item_type[]" value="' + item.item_type + '">';
            item_html +='<select class="selectpicker form-control item_type" data-style="btn-info" data-title="请选择道具" data-live-search="true" >';
            $.each(data_object, function (key_son, item_son) {
                if(item.item_type == item_son.id){
                    item_html +='<option value="' + item_son.id + '" selected>' + item_son.id + '--' + item_son.name + '</option>';
                }else{
                    item_html +='<option value="' + item_son.id + '">' + item_son.id + '--' + item_son.name + '</option>';
                }
            });
            item_html +='</select>';
            item_html +='<input style="width: 90px; float: left;" class="configInput form-control" value="' + item.item_num + '" name="gift_item_num[]" type="number" min="1" onkeyup="this.value=value.replace(/^(0+)|[^\d]+/g,"")">';
            item_html +='</div>';
        });
        $(".item-fuzhi").empty();
        $(".item-fuzhi").append(item_html);
        $('.item_type').selectpicker('refresh');
    }

    function serverType(obj){
        var selectedValue = $(obj).val();
        if(selectedValue == 1){     //固定码，手动填写固定码，隐藏礼包的兑换码个数设置
            $(".all-server").show();
            $(".only-server").hide();
        }else{
            $(".all-server").hide();
            $(".only-server").show();
        }
    }
    
</script>
