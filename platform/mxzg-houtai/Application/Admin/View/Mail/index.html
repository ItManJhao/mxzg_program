<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>邮件列表</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="box">
                                <div class="box-header">  
                                    <div class="panel-body">
                                        <form id="formSearch" style="width: auto;display: inline-block;" action="{:U('mail/index')}" method="get" class="form-horizontal form-inline">
                                            <label class="control-label">标题：</label>
                                            <input type="text" placeholder="模糊搜索" name="title" value="{$search_params.title}" style="width: 120px;" class="form-control">&nbsp;&nbsp;

                                            <label class="control-label">角色id：</label>
                                            <input type="text" placeholder="精确搜索" name="role_id" value="{$search_params.role_id}" style="width: 120px;" class="form-control">&nbsp;&nbsp;

                                            <label class="control-label">邮件状态：</label>
                                            <select class="form-control" name="status">
                                                <option <if condition="$search_params['status'] == '-1'"> selected </if> value="-1">所有状态</option>
                                                <option <if condition="$search_params['status'] == 0"> selected </if> value="0">待审核</option>
                                                <option <if condition="$search_params['status'] == 1"> selected </if> value="1">审核成功</option>
                                                <option <if condition="$search_params['status'] == 2"> selected </if> value="2">审核失败</option>
                                            </select>

                                            <label class="control-label">操作类型：</label>
                                            <select class="form-control" name="oprate_type">
                                                <option <if condition="$search_params['oprate_type'] == '-1'"> selected </if> value="-1">所有操作类型</option>
                                                <option <if condition="$search_params['oprate_type'] == 0"> selected </if> value="0">手动添加</option>
                                                <option <if condition="$search_params['oprate_type'] == 1"> selected </if> value="1">文件批量添加</option>
                                            </select>

                                            <button type="button" style="margin-left:30px;float: right;" onclick="ajax_search()" id="btn_query" class="btn btn-primary">查询</button>
                                        </form>
                                        <button onclick="window.location.href=location.href;"  class="btn btn-primary " style="float: right;margin-right:10px;"><i class="glyphicon glyphicon-refresh"></i>刷新</button>
                                        <button onclick="openYemian('{:U('mail/addsingle')}','添加单服邮件')" type="button" class="btn btn-primary" style="float: right;margin-right:10px;"><i class="fa fa-plus"></i>添加单服邮件</button>
                                        <button onclick="openYemian('{:U('mail/addall')}','添加全服邮件')" type="button" class="btn btn-primary" style="float: right;margin-right:10px;"><i class="fa fa-plus"></i>添加全服邮件</button>
                                        <button onclick="openYemian('{:U('mail/adds')}','批量添加邮件')" type="button" class="btn btn-primary" style="float: right;margin-right:10px;"><i class="fa fa-plus"></i>批量添加邮件</button>
                                        <a class="btn btn-danger" href="javascript:void(0)" title="批量审核" data-url="{:U('mail/ajax_sends')}" style="float: right;margin-right:10px;" data-id="{$vo.id}"  onclick="send_mails(this,'确定批量审核通过？','{:U('mail/ajax_sends')}')" ><i class="fa fa-pencil"></i>批量审核</a>
 
                                    </div>
                                </div>
                                <div class="box-body">
                                    <div class="row">
                                        <div class="col-sm-12">
                                            <form method="post" οnsubmit="return false;" enctype="multipart/form-data" id="form-order">
                                            <table class="table table-bordered" style="word-wrap: break-word; word-break: break-all;">
                                                <thead>
                                                    <tr>
                                                        <th style="width: 1px;"><input type="checkbox" onclick="$('input[name*=\'ids\']').prop('checked', this.checked);"></th>
                                                        <th width="3%">主键ID</th>
                                                        <th width="15%">区服</th>
                                                        <th width="15%">角色</th>
                                                        <th width="5%">邮件类型</th>
                                                        <th width="5%">标题</th>
                                                        <th width="5%">内容</th>
                                                        <th width="35%">包裹</th>
                                                        <th width="5%">状态</th>
                                                        <th width="5%">审核结果</th>
                                                        <th width="5%">管理员</th>
                                                        <th width="5%">添加时间</th>
                                                        <th>操作</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="ajaxList">
                                                    <volist name="list" id="vo">
                                                        <tr role="row"> 
                                                            <td><input type="checkbox" name="ids[]" value="{$vo.id}"></td>
                                                            <td>{$vo.id}</td>
                                                            <td>{$vo.server_data}</td>
                                                            <td>{$vo.role_data}</td>
                                                            <td><if condition="$vo['type'] == 1">全服邮件<elseif condition="$vo['type'] == 2"/>单服邮件<else/>未知</if></td>
                                                            <td>{$vo.title}</td>
                                                            <td>{$vo.content}</td>
                                                            <td>{$vo.item_data}</td>
                                                            <td><if condition="$vo['status'] == 1">审核成功<elseif condition="$vo['status'] == 2"/>审核失败<else/>待审核</if></td>
                                                            <td>{$vo.note}</td>
                                                            <td>{$vo.admin_name}</td>
                                                            <td>{:date('Y-m-d H:i:s',$vo['created_at'])}</td>
                                                            <td>
                                                                <if condition="$vo['status'] == 0">
                                                                    <a class="btn btn-primary" href="javascript:;" title="编辑" onclick="openYemian('/admin.php/mail/edit?id={$vo.id}','编辑邮件')" ><i class="fa fa-pencil"></i>编辑邮件</a>
                                                                    <a class="btn btn-danger" href="javascript:void(0)" title="审核通过" data-url="{:U('mail/ajax_send')}" data-id="{$vo.id}" data-status="1" onclick="send_mail(this,'确定审核通过？','{:U('mail/ajax_send')}')" ><i class="fa fa-pencil"></i>审核通过</a>
                                                                    <a class="btn btn-danger" href="javascript:void(0)" title="审核不通过" data-url="{:U('mail/ajax_send')}" data-id="{$vo.id}" data-status="2" onclick="send_mail(this,'确定审核不通过？','{:U('mail/ajax_send')}')" ><i class="fa fa-pencil"></i>审核不通过</a>
                                                                    <else/>
                                                                    <a class="btn btn-warning" href="javascript:;" title="已审核" >已审核</a>
                                                                </if>
                                                            </td>
                                                         </tr>
                                                    </volist>
                                                </tbody>
                                            </table>
                                            </form>
                                            <div>
                                                <div style="margin-top:20px;width: 100%;" id="pagelist">{$page}<span style="float:right;">共{$count}条</span></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function ajax_search(){
        $('#formSearch').submit();
    }

    //审核，发送邮件
    function send_mail(obj,name,url) {
        top.layer.confirm(name,{
            icon : 3,
            btn:['确定','取消'],
        } , function(){
            var id=$(obj).attr("data-id");
            var status=$(obj).attr("data-status");
            $.ajax({
                url : url,
                type : "post",
                data : {id:id,status:status},
                dataType : "json",
                success:function(data){
                    top.layer.alert(data.message, {icon: 6});
                    // if (data.status == 0) {
                    //     top.layer.msg(data.message);
                    // } else {
                    //     top.layer.msg(data.message);
                    //     // $(obj).parent().parent().remove();
                    // }
                    window.location.reload();
                }
            });
        } , function(){
            layer.close(); //再执行关闭
        })
    }

    //批量审核，发送邮件
    function send_mails(obj,name,url) {
        top.layer.confirm(name,{
            icon : 3,
            btn:['确定','取消'],
        } , function(){
            var ids = "";
            $("tbody input[type=checkbox]:checked").each(function () {
                if ($(this).is(':checked')) {
                    ids += $(this).val()+",";
                }
            });
            $.ajax({
                url : url,
                type : "post",
                data : {ids:ids},
                dataType : "json",
                success:function(data){
                    top.layer.alert(data.message, {icon: 6});
                    // if (data.status == 0) {
                    //     top.layer.msg(data.message);
                    // } else {
                    //     top.layer.msg(data.message);
                    //     // $(obj).parent().parent().remove();
                    // }
                    window.location.reload();
                }
            });
        } , function(){
            layer.close(); //再执行关闭
        })
    }

</script>


<include file="Public:footer" />
