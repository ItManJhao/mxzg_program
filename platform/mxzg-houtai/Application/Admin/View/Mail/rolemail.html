<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>玩家邮件列表</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="box">
                                <div class="box-header">  
                                    <div class="panel-body">
                                        <form id="formSearch" style="width: auto;display: inline-block;" action="{:U('Mail/RoleMail')}" method="get" class="form-horizontal form-inline">
                                            <label class="control-label">角色id：</label>
                                            <input type="text" placeholder="精确搜索" name="role_id" value="{$search_params.role_id}" style="width: 120px;" class="form-control">&nbsp;&nbsp;

                                            <label class="control-label" style="padding-left: 5px;">服务器</label>
                                            <select class="form-control sid" name="sid">
                                                <option value="0">请选择服务器</option>
                                                <volist name="servers" id="servers_vo">
                                                    <eq name="servers_vo.id" value="$search_params.sid">
                                                        <option value="{$servers_vo.id}" selected>{$servers_vo.id}--{$servers_vo.server_name}</option>
                                                        <else />
                                                        <option value="{$servers_vo.id}">{$servers_vo.id}--{$servers_vo.server_name}</option>
                                                    </eq>
                                                </volist>
                                                </if>
                                            </select>

                                            <label class="control-label">操作类型：</label>
                                            <select class="form-control oprate" name="oprate">
                                                <option <if condition="$search_params['oprate'] == '1'"> selected </if> value="1">系统邮件</option>
                                                <option <if condition="$search_params['oprate'] == 2"> selected </if> value="2">个人邮件</option>
                                            </select>

                                            <button type="button" style="margin-left:30px;float: right;" onclick="ajax_search()" id="btn_query" class="btn btn-primary">查询</button>
                                        </form>
                                        <button onclick="window.location.href=location.href;"  class="btn btn-primary " style="float: right;margin-right:10px;"><i class="glyphicon glyphicon-refresh"></i>刷新</button>
                                        <a class="btn btn-danger" href="javascript:void(0)" title="批量删除" data-url="{:U('mail/ajax_del_rolemail')}" style="float: right;margin-right:10px;" data-id="{$vo.id}"  onclick="del_rolemail(this,'确定批量删除？','{:U('mail/ajax_del_rolemail')}')" ><i class="fa fa-pencil"></i>批量删除</a>
 
                                    </div>
                                </div>
                                <div class="box-body">
                                    <div class="row">
                                        <div class="col-sm-12">
                                            <form method="post" οnsubmit="return false;" enctype="multipart/form-data" id="form-order">
                                                <if condition="empty($list) neq true">
                                                    <table class="table table-bordered" style="word-wrap: break-word; word-break: break-all;">
                                                        <thead>
                                                            <tr>
                                                                <th><input type="checkbox" onclick="$('input[name*=\'ids\']').prop('checked', this.checked);"></th>
                                                                <th>邮件ID</th>
                                                                <th>角色ID</th>
                                                                <th>邮件奖励</th>
                                                                <th>标题</th>
                                                                <th>内容</th>
                                                                <th>创建时间</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody id="ajaxList">
                                                            <volist name="list" id="vo">
                                                                <tr role="row"> 
                                                                    <td><input type="checkbox" name="ids[]" value="{$vo.id}"></td>
                                                                    <td>{$vo.id}</td>
                                                                    <td>{$vo.rid}</td>
                                                                    <td>{$vo.goods}</td>
                                                                    <td>{$vo.title}</td>
                                                                    <td>{$vo.content}</td>
                                                                    <td>{$vo.create_date}</td>
                                                                </tr>
                                                            </volist>
                                                        </tbody>
                                                    </table>
                                                <else />
                                                    <p style="text-align: center; color: red;font-size:20px;">{$error_msg}</p>
                                                </if>
                                            </form>
                                            <div>
                                                <div style="margin-top:20px;width: 100%;" id="pagelist">{$page}<span style="float:right;">共{$count}条</span></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function ajax_search(){
        $('#formSearch').submit();
    }

    //批量删除邮件
    function del_rolemail(obj,name,url) {
        top.layer.confirm(name,{
            icon : 3,
            btn:['确定','取消'],
        } , function(){
            var ids = "";
            $("tbody input[type=checkbox]:checked").each(function () {
                if ($(this).is(':checked')) {
                    ids += $(this).val()+",";
                }
            });
            var sid = $(".sid").find("option:selected").val();
            var oprate = $(".oprate").find("option:selected").val();
            $.ajax({
                url : url,
                type : "post",
                data : {ids:ids,sid:sid,oprate:oprate},
                dataType : "json",
                success:function(data){
                    top.layer.alert(data.message, {icon: 6});
                    // if (data.status == 0) {
                    //     top.layer.msg(data.message);
                    // } else {
                    //     top.layer.msg(data.message);
                    //     // $(obj).parent().parent().remove();
                    // }
                    window.location.reload();
                }
            });
        } , function(){
            layer.close(); //再执行关闭
        })
    }

</script>


<include file="Public:footer" />
