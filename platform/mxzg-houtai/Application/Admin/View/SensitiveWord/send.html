<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>发送敏感词</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('SensitiveWord/ajax_send')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                            <div class="tab-pane active">

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>要发送的敏感词：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="sensitive_word_str" type="text" value="{$sensitive_word_str}" required="" aria-required="true" disabled>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器：</label>
                                    
                                    <!-- 服务器全选html代码 -->
                                    <include file="Public:servercheckall" />
                                </div>

                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('SensitiveWord/ajax_send')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>
