<include file="Public:header" />


<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>添加白名单</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('whiteList/ajax_add')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                            <div class="tab-pane active">

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>用户uid：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="uid" value="{$white_info.uid}"  type="text" required="" aria-required="true">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>ip：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="ip" value="{$white_info.ip}"  type="text" required="" aria-required="true">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">是否启用：</label>
                                    <div class="col-sm-8">
                                        <label class="checkbox-inline i-checks">
                                            <input type="radio" name="status" value="1" <if condition="$white_info['status'] == 1"> checked="checked" </if> >启用</label>
                                        <label class="checkbox-inline i-checks">
                                            <input type="radio" name="status" value="0" <if condition="$white_info['status'] == 0"> checked="checked" </if> >弃用</label>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>备注：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="note" value="{$white_info.note}" type="text" required="" aria-required="true">
                                    </div>
                                </div>

                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="id" value="{$white_info.id}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('whiteList/ajax_update')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>
<script language="javascript">

</script>

<include file="Public:footer" />
