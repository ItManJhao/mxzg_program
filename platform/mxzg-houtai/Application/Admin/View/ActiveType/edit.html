<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>活动类型</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('activeType/ajax_updata')}" method="post" id="artkindFrom" class="form-horizontal">
                            <div class="tab-content">

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>活动类型id：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="new_id" value="{$active_type_info.id}" type="text" required="" aria-required="true">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>活动类型名称：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="name" value="{$active_type_info.name}" type="text" required="" aria-required="true">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>活动类型描述：</label>
                                    <div class="col-sm-8">
                                        <textarea placeholder="请输入内容" name="desc" class="configInput form-control" required="" aria-required="true">{$active_type_info.desc}</textarea>
                                    </div>
                                </div>

                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="old_id" value="{$active_type_info.id}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('activeType/ajax_updata')}')" type="button">保存</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div> 
<script language="javascript">

</script>


<include file="Public:footer" />
