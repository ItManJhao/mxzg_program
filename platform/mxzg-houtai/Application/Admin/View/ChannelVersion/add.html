<include file="Public:header" />


<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>添加渠道版本</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('ChannelVersion/ajax_add')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                            <div class="tab-pane active">

                                <div class="form-group">
                                    <label class="col-sm-2 control-label">渠道：</label>
                                    <div class="col-sm-8">
                                        <select class="form-control singleSelect" name="cid_str">
                                            <option value="0">请选择渠道</option>
                                            <volist name="channels" id="channels_vo">
                                                <option value="{$channels_vo.id}-{$channels_vo.parent_id}">{$channels_vo.id}--{$channels_vo.name}</option>
                                            </volist>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>包版本</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="package_version" type="text" required="" aria-required="true">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>资源版本</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="version" type="text" required="" aria-required="true">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>过审标记</label>
                                    <div class="col-sm-8">
                                        <input name="is_past" type="radio" value="0" checked aria-required="true">未过审&nbsp;&nbsp;&nbsp;
                                        <input name="is_past" type="radio" value="1" aria-required="true">已过审
                                    </div>
                                </div>

                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('ChannelVersion/ajax_add')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>
<script language="javascript">
    $(document).ready(function() {
        $('.singleSelect').select2();

    });

</script>



<include file="Public:footer" />
