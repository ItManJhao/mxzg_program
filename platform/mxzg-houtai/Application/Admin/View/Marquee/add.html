<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>添加跑马灯</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('marquee/ajax_add')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                            <div class="tab-pane active">

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>标题：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="name" type="text" required="" aria-required="true">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>设备类型：</label>
                                    <div class="col-sm-8">
                                        <select class="form-control" name="device_type">
                                            <option value="0">请选择设备类型</option>
                                            <option value="1">安卓</option>
                                            <option value="2">ios</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group" style="display:none;">
                                    <label class="col-sm-2 control-label">状态：</label>
                                    <div class="col-sm-8">
                                        <label class="checkbox-inline i-checks">
                                            <input type="radio" name="status" value="1" checked="checked" >开启</label>
                                        <label class="checkbox-inline i-checks">
                                            <input type="radio" name="status" value="0" >关闭</label>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器：</label>
                                    
                                    <!-- 服务器全选html代码 -->
                                    <include file="Public:servercheckall" />
                                </div>


                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>内容：</label>
                                    <div class="col-sm-8">
                                        <textarea placeholder="请输入内容" name="content" class="configInput form-control" required="" aria-required="true"></textarea>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>跑马灯循环次数：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="loop_count" type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,'')" required="" aria-required="true">
                                    </div>
                                </div>
                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('marquee/ajax_add')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>
<!-- 服务器全选js代码 -->
<script type="text/javascript" src="/Public/static/admin/js/servercheckall.js"></script>

<script language="javascript">
    

</script>


<include file="Public:footer" />
