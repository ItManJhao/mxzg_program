<include file="Public:header" />
<style type="text/css">
    .arrow {
    margin: 100px auto;
    width: 300px;
    height: 150px;
    }
    
    .item {
    float: left;
    clear: both;
    margin-bottom: 23px;
    }
    /* 向上的箭头 */
    
    .arrow-top {
    float:right;
    padding-top: 5px;
    margin-right:10px;
    font-size: 0;
    line-height: 0;
    border-width: 8px;
    border-color: black;
    border-top-width: 0;
    border-style: dashed;
    border-bottom-style: solid;
    border-left-color: transparent;
    border-right-color: transparent;
    }
    /* 向右的箭头 */
    
    .arrow-right {
    font-size: 0;
    line-height: 0;
    border-width: 10px;
    border-color: black;
    border-right-width: 0;
    border-style: dashed;
    border-left-style: solid;
    border-top-color: transparent;
    border-bottom-color: transparent;
    }
    /* 向下的箭头 */
    
    .arrow-bottom {
    float:right;
    padding-top: 5px;
    margin-right:10px;
    font-size: 0;
    line-height: 0;
    border-width: 8px;
    border-color: black;
    border-bottom-width: 0;
    border-style: dashed;
    border-top-style: solid;
    border-left-color: transparent;
    border-right-color: transparent;
    }
    /* 向左的箭头 */
    
    .arrow-left {
    font-size: 0;
    line-height: 0;
    border-width: 10px;
    border-color: black;
    border-left-width: 0;
    border-style: dashed;
    border-right-style: solid;
    border-top-color: transparent;
    border-bottom-color: transparent;
    }
    </style>

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>账号信息列表</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="box">
                                <div class="box-header">  
                                    <div class="panel-body">
                                        <form id="formSearch" style="width: auto;display: inline-block;" action="{:U('User/index')}" method="get" class="form-horizontal form-inline">
                                            <label class="control-label">账号id：</label>
                                            <input type="text" placeholder="精确搜索" name="id" value="{$search_params.id}" style="width: 120px;" class="form-control">
                                            <label class="control-label">&nbsp;&nbsp;渠道uid：</label>
                                            <input type="text" placeholder="精确搜索" name="open_id" value="{$search_params.open_id}" style="width: 120px;" class="form-control">
                                            <label class="control-label">&nbsp;&nbsp;设备唯一码：</label>
                                            <input type="text" placeholder="模糊搜索" name="uuid" value="{$search_params.uuid}" style="width: 120px;" class="form-control">

                                            <label class="control-label">&nbsp;&nbsp;渠道：</label>
                                            <select class="form-control c_son_id" name="c_son_id">
                                                <option value="0">请选择子渠道</option>
                                                <volist name="channels" id="channels_vo">
                                                    <eq name="channels_vo.id" value="$search_params.c_son_id">
                                                        <option value="{$channels_vo.id}" selected>{$channels_vo.name}</option>
                                                        <else />
                                                        <option value="{$channels_vo.id}">{$channels_vo.name}</option>
                                                    </eq>
                                                </volist>
                                                </if>
                                            </select>

                                            <label class="control-label" style="padding-left: 5px;">&nbsp;&nbsp;开始时间</label>
                                            <input class="configInput form-control" style="width: 160px;" id="start_time" name="start_time" type="text" onclick="laydate({elem: '#start_time', istime: true, format: 'YYYY-MM-DD'})" required="" aria-required="true" value="{$search_params['start_time']}">
                                            <label class="control-label" style="padding-left: 5px;">&nbsp;&nbsp;结束时间</label>
                                            <input class="configInput form-control" style="width: 160px;" id="end_time" name="end_time" type="text" onclick="laydate({elem: '#end_time', istime: true, format: 'YYYY-MM-DD'})" required="" aria-required="true" value="{$search_params['end_time']}">
                                            

                                            <input type="hidden" class="sort-field-input" name="sort_field" value="">
                                            <button type="button" style="margin-left:30px" onclick="ajax_search()" id="btn_query" class="btn btn-primary">查询</button>
                                        </form>
                                        <a class="btn btn-primary export" style="float:right;" href="javascript:void(0);" title="导出" ><i class="fa fa-cloud-download"></i>导出</a>
                                    </div>
                                </div>
                                <div class="box-body">
                                    <div class="row">
                                        <div class="col-sm-12">
                                            <if condition="empty($list) neq true">
                                                <table class="table table-bordered">
                                                    <thead>
                                                        <tr>
                                                            <th>账号id</th>
                                                            <th>渠道uid</th>
                                                            <th>渠道</th>
                                                            <th>最后登录的区服</th>
                                                            <th>最后登陆时间</th>
                                                            <th>登录天数</th>
                                                            <th>创建时间</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="ajaxList">
                                                        <volist name="list" id="vo">
                                                            <tr role="row"> 
                                                                <td>{$vo.id}</td>
                                                                <td>{$vo.open_id}</td>
                                                                <td>{$vo.channel_name}（{$vo.parent_name}）</td>
                                                                <td>{$vo.server_name}（{$vo.last_login_sid}）</td>
                                                                <td>{:date('Y-m-d H:i:s',$vo['last_login_time'])}</td>
                                                                <td>{$vo.login_days}</td>
                                                                <td>{:date('Y-m-d H:i:s',$vo['created_at'])}</td>
                                                            </tr>
                                                        </volist>
                                                    </tbody>
                                                </table>
                                            <else />
                                                <p style="text-align: center; color: red;font-size:20px;">{$error_msg}</p>
                                            </if>
                                            <div>
                                                <div style="margin-top:20px;width: 100%;" id="pagelist">{$page}<span style="float:right;">共{$count}条</span></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>

    function ajax_search(){
        $('#formSearch').submit();
    }

    $(".export").click(function(){
        var c_son_id = $(".c_son_id").val();
        var id = $(" input[ name='id' ] ").val();
        var open_id = $(" input[ name='open_id' ] ").val();
        var uuid = $(" input[ name='uuid' ] ").val();
        var start_time = $("#start_time").val(); 
        var end_time = $("#end_time").val();
        window.location.href="/admin.php/User/export?c_son_id=" + c_son_id + "&id=" + id + "&open_id=" + open_id + "&uuid=" + uuid + "&start_time=" + start_time + "&end_time=" + end_time;
    });

</script>

<include file="Public:footer" />
