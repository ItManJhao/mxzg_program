<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>全局配置</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('GlobalConfig/ajax_updata')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                        <div class="tab-pane active">

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器通用创角阈值：</label>
                                <div class="col-sm-8">
                                    <input style="width: 150px; float: left;" class="configInput form-control" name="role_nums_limit" type="number" value="{$global_config.role_nums_limit}" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,"")">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>是否开启服务器爆满状态时禁止新用户进入游戏：</label>
                                <div class="col-sm-8">
                                    <label class="checkbox-inline i-checks">
                                        <input type="radio" name="is_server_full_tip" value="1" <if condition="$global_config['is_server_full_tip'] == 1"> checked="checked" </if> >开启</label>
                                    <label class="checkbox-inline i-checks">
                                        <input type="radio" name="is_server_full_tip" value="0" <if condition="$global_config['is_server_full_tip'] == 0"> checked="checked" </if> >关闭</label>
                                </div>
                            </div>
              
                        </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="id" value="{$global_config.id}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('GlobalConfig/ajax_updata')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div> 
<script language="javascript">
    
</script>



<include file="Public:footer" />
