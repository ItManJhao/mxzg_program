<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>公告列表</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="box">
                                <div class="box-header">  
                                    <div class="panel-body">
                                        <form id="formSearch" style="width: auto;display: inline-block;" action="{:U('notice/index')}" method="get" class="form-horizontal form-inline">
                                            <label class="control-label">标题：</label>
                                            <input type="text" placeholder="模糊搜索" name="name" value="{$search_params.name}" style="width: 120px;" class="form-control">
                                            <label class="control-label">设备类型：</label>
                                            <select class="form-control" name="device_type">
                                                <option <if condition="$search_params['device_type'] == 0"> selected </if> value="0">所有设备类型</option>
                                                <option <if condition="$search_params['device_type'] == 1"> selected </if> value="1">安卓</option>
                                                <option <if condition="$search_params['device_type'] == 2"> selected </if> value="2">ios</option>
                                            </select>
                                            <label class="control-label">渠道：</label>
                                            <select class="form-control" name="c_son_id">
                                                <option value="0">请选择子渠道</option>
                                                <volist name="channels" id="channels_vo">
                                                    <eq name="channels_vo.id" value="$search_params.c_son_id">
                                                        <option value="{$channels_vo.id}" selected>{$channels_vo.name}</option>
                                                        <else />
                                                        <option value="{$channels_vo.id}">{$channels_vo.name}</option>
                                                    </eq>
                                                </volist>
                                                </if>
                                            </select>
                                            <button type="button" style="margin-left:30px" onclick="ajax_search()" id="btn_query" class="btn btn-primary">查询</button>
                                        </form>
                                        <button onclick="window.location.href=location.href;"  class="btn btn-primary " style="float: right;margin-right:10px;"><i class="glyphicon glyphicon-refresh"></i>刷新</button>
                                        <button onclick="openYemian('{:U('notice/add')}','添加公告')" type="button" class="btn btn-primary" style="float: right;margin-right:10px;"><i class="fa fa-plus"></i>添加</button>
                                    </div>
                                </div>
                                <div class="box-body">
                                    <div class="row">
                                        <div class="col-sm-12">
                                            <form method="post" enctype="multipart/form-data" id="form-order">
                                            <table class="table table-bordered">
                                                <thead>
                                                    <tr>
                                                        <th style="width: 1px;"><input type="checkbox" onclick="$('input[name*=\'ids\']').prop('checked', this.checked);"></th>
                                                        <th width="5%">公告ID</th>
                                                        <th>标题</th>
                                                        <th>内容</th>
                                                        <th>设备类型</th>
                                                        <th>排序</th>
                                                        <th>开始时间</th>
                                                        <th>结束时间</th>
                                                        <th>创建时间</th>
                                                        <th>操作</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="ajaxList">
                                                    <volist name="list" id="vo">
                                                        <tr role="row"> 
                                                            <td><input type="checkbox" name="ids[]" value="{$vo.id}"></td>
                                                            <td>{$vo.id}</td>
                                                            <td>{$vo.name}</td>
                                                            <td>{$vo.content}</td>
                                                            <td><if condition="$vo['device_type'] == 1">安卓<elseif condition="$vo['type'] == 2"/>iod<else/>所有设备</if></td>
                                                            <td>{$vo.sort}</td>
                                                            <td>{:date('Y-m-d H:i:s',$vo['start_time'])}</td>
                                                            <td>{:date('Y-m-d H:i:s',$vo['end_time'])}</td>
                                                            <td>{:date('Y-m-d H:i:s',$vo['created_at'])}</td>
                                                            <td>
                                                                <a class="btn btn-primary" href="javascript:;" title="编辑" onclick="openYemian('/admin.php/notice/edit?id={$vo.id}','编辑公告')">编辑</a>
                                                                <!-- <a class="btn btn-danger" href="javascript:void(0)" title="删除" data-url="{:U('channel/ajax_delete')}" data-id="{$vo.id}" <if condition="in_array('3',$user_root['function_id'])">  onclick="delarticle(this,'确定删除该渠道？',{$vo.id},'{:U('channel/ajax_delete')}')" <else/> onclick="layer.msg('没有操作权限', {icon: 5})" </if>><i class="fa fa-trash-o"></i></a> -->
                                                                <a class="btn btn-danger" href="javascript:void(0)" title="删除" data-url="{:U('notice/ajax_delete')}" data-id="{$vo.id}"  onclick="notice_delete(this,'确定删除吗？','{:U('notice/ajax_delete')}')" ><i class="fa fa-trash-o"></i>删除</a>
                                                            </td>
                                                         </tr>
                                                    </volist>
                                                </tbody>
                                            </table>
                                            </form>
                                            <div>
                                                <div style="margin-top:20px;width: 100%;" id="pagelist">{$page}<span style="float:right;">共{$count}条</span></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<input id="handle_status" value="" hidden="hidden">
<input id="kind_id" value="0" hidden="hidden">
 
<script>
    function ajax_search(){
        $('#formSearch').submit();
    }


    function notice_delete(obj,name,url) {
        top.layer.confirm(name,{
            icon : 3,
            btn:['确定','取消'],
        } , function(){
            var id=$(obj).attr("data-id");
            $.ajax({
                url : url,
                type : "post",
                data : {id:id},
                dataType : "json",
                success:function(data){
                    if (data.status == 0) {
                        top.layer.msg(data.message);
                    } else {
                        top.layer.msg(data.message);
                        // $(obj).parent().parent().remove();
                    }
                }
            });
        } , function(){
            layer.close(); //再执行关闭
        })
    }

    $(".kind_id").change(function(){
      var kind_id = $(this).val();
      $("#kind_id").val(kind_id);
    });
</script>

<include file="Public:footer" />
