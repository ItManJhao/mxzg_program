<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>编辑公告</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('notice/ajax_updata')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                        <div class="tab-pane active">

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>公告ID：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" value="{$notice_info.id}" type="text" required="" aria-required="true" disabled>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>公告标题：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="name" value="{$notice_info.name}" type="text" required="" aria-required="true">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>公告的称谓：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="label" value="{$notice_info.label}" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>公告设备类型：</label>
                                <div class="col-sm-8">
                                    <select class="form-control" name="device_type">
                                        <option value="0" <if condition="$notice_info['device_type'] == 0"> selected </if>>所有设备类型</option>
                                        <option value="1" <if condition="$notice_info['device_type'] == 1"> selected </if>>安卓</option>
                                        <option value="2" <if condition="$notice_info['device_type'] == 2"> selected </if>>ios</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group" style="display:none;">
                                <label class="col-sm-2 control-label">状态：</label>
                                <div class="col-sm-8">
                                    <label class="checkbox-inline i-checks">
                                        <input type="radio" name="status" value="1" <if condition="$notice_info['status'] == 1"> checked="checked" </if> >开启</label>
                                    <label class="checkbox-inline i-checks">
                                        <input type="radio" name="status" value="0" <if condition="$notice_info['status'] == 0"> checked="checked" </if> >关闭</label>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>渠道：</label>
                                <div class="col-sm-8">
                                    <div class="check-channels">
                                        <div class="checkbox">
                                            <label>
                                                <input style="width: 21px;height: 21px;" class="channel-check-all" type="checkbox" >
                                                全选
                                            </label>
                                        </div>
                                        <div class="checkbox">
                                            <volist name="channels" id="channels_vo">
                                                <label>
                                                    <input style="width: 21px;height: 21px;" class="channel-check"  type="checkbox" name="c_son_ids[]" value="{$channels_vo['id']}"  <if condition="in_array($channels_vo['id'], $notice_info['c_son_id'])"> checked  </if>>
                                                    {$channels_vo['name']}
                                                    
                                                </label>
                                            </volist>
                                        </div>
                                    </div>
                                </div>
                            </div>                          

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>内容：</label>
                                <div class="col-sm-8" >
                                    <textarea style="height: 300px;" placeholder="请输入内容" name="content" class="configInput form-control" required="" aria-required="true">{$notice_info.content}</textarea>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>排序sort：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="sort" value="{$notice_info.sort}" type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,'')" required="" aria-required="true">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>开始时间：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" id="start_time" name="start_time" type="text" onclick="laydate({elem: '#start_time', istime: true, format: 'YYYY-MM-DD hh:mm:ss'})" required="" aria-required="true" value="{:date('Y-m-d H:i:s', $notice_info['start_time'] )}">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>结束时间：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" id="end_time" name="end_time" type="text" onclick="laydate({elem: '#end_time', istime: true, format: 'YYYY-MM-DD hh:mm:ss'})" required="" aria-required="true" value="{:date('Y-m-d H:i:s', $notice_info['end_time'])}">
                                </div>
                            </div>
              
                        </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="id" value="{$notice_info.id}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('notice/ajax_updata')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div> 
<script language="javascript">
    //处理渠道全选
    $(".check-channels").each(function(){
        var check_servcers = $(this).find(".channel-check").first();
        isCheckAlls('channel-check-all','channel-check', check_servcers);
    });
    $(".channel-check").click(function(){    
        isCheckAlls('channel-check-all','channel-check', $(this));
    });
    $(".channel-check-all").click(function () {
        doCheckAlls('channel-check-all', 'channel-check', $(this));
    });
</script>



<include file="Public:footer" />
