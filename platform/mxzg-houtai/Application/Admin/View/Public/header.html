<body class="fixed-sidebar full-height-layout gray-bg">

<div class="spinner123" style="display:none;">    <div class="rect1"></div>    <div class="rect2"></div>    <div class="rect3"></div>    <div class="rect4"></div>    <div class="rect5"></div>  </div>
<style>
.spinner123 {    
    position: fixed; left: 0;right: 0;top: 0;bottom: 0; /*使得loading层浮动到其他层上面，并且尺寸和整个屏幕大小一样*/
    z-index: 10;    /*给个 z-index 覆盖到主题内容上面*/

    background: rgba(0, 0, 0, 0.2);

    display: flex;  /*采用flex布局*/
    
    justify-content:center; /*loading-box中的内容 水平居中*/
    align-items: center;    /*loading-box中的内容 垂直居中*/
    }    
.spinner123 > div {    
    background-color: #67CF22;    
    height: 100px;    
    width: 6px;    
    display: inline-block;        
    -webkit-animation: stretchdelay 1.2s infinite ease-in-out;    
    animation: stretchdelay 1.2s infinite ease-in-out;  
    }    
.spinner123 .rect2 {    
    -webkit-animation-delay: -1.1s;    
    animation-delay: -1.1s;  
    }    
.spinner123 .rect3 {    
    -webkit-animation-delay: -1.0s;    
    animation-delay: -1.0s;  
    }    
.spinner123 .rect4 {    
    -webkit-animation-delay: -0.9s;    
    animation-delay: -0.9s;  
    }    
.spinner123 .rect5 {    
    -webkit-animation-delay: -0.8s;    
    animation-delay: -0.8s;  
    }    
@-webkit-keyframes stretchdelay {    
    0%, 40%, 100% { -webkit-transform: scaleY(0.4) }      
    20% { -webkit-transform: scaleY(1.0) }  
    }   
@keyframes stretchdelay {    
    0%, 40%, 100% {       
        transform: scaleY(0.4);      
        -webkit-transform: scaleY(0.4);    
        }  
    20% {       
        transform: scaleY(1.0);      
        -webkit-transform: scaleY(1.0);    
        }  
    }

</style>
