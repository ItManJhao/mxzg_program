<include file="Public:header" />


<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>大区列表</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="box">
                                <div class="box-header">  
                                    <div class="panel-body">
                                        <form id="formSearch" style="width: auto;display: inline-block;" action="{:U('bigServer/index')}" method="get" class="form-horizontal form-inline">
                                            <label class="control-label">渠道：</label>
                                            <select class="form-control" name="c_son_id">
                                                <option value="0">请选择渠道</option>
                                                <volist name="channels" id="channels_vo">
                                                    <eq name="channels_vo.id" value="$search_params.c_son_id">
                                                        <option value="{$channels_vo.id}" selected>{$channels_vo.name}</option>
                                                        <else />
                                                        <option value="{$channels_vo.id}">{$channels_vo.name}</option>
                                                    </eq>
                                                </volist>
                                                </if>
                                            </select>
                                            <label class="control-label">大区名称：</label>
                                            <input type="text" placeholder="模糊搜索" name="name" value="{$search_params.name}" style="width: 120px;" class="form-control">
                                            <button type="button" style="margin-left:30px" onclick="ajax_search()" id="btn_query" class="btn btn-primary">查询</button>
                                        </form>
                                        <button onclick="window.location.href=location.href;"  class="btn btn-primary " style="float: right;margin-right:10px;"><i class="glyphicon glyphicon-refresh"></i>刷新</button>
                                        <button onclick="openYemian('{:U('bigServer/add')}','添加大区')" type="button" class="btn btn-primary" style="float: right;margin-right:10px;"><i class="fa fa-plus"></i>添加</button>
                                    </div>
                                </div>
                                <div class="box-body">
                                    <div class="row">
                                        <div class="col-sm-12">
                                            <form method="post" enctype="multipart/form-data" id="form-order">
                                            <table class="table table-bordered">
                                                <thead>
                                                    <tr>
                                                        <th style="width: 1px;"><input type="checkbox" onclick="$('input[name*=\'ids\']').prop('checked', this.checked);"></th>
                                                        <th width="5%">主键ID</th>
                                                        <th>大区名称</th>
                                                        <th>大渠道名称</th>
                                                        <th>小渠道名称</th>
                                                        <th>排序</th>
                                                        <th>创建时间</th>
                                                        <th>操作</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="ajaxList">
                                                    <volist name="list" id="list_vo">
                                                        <tr role="row"> 
                                                            <td><input type="checkbox" name="ids[]" value="{$list_vo.id}"></td>
                                                            <td>{$list_vo.id}</td>
                                                            <td>{$list_vo.name}</td>
                                                            <td>{$list_vo.c_id}--{$list_vo.parent_name}</td>
                                                            <td>{$list_vo.c_son_id}--{$list_vo.channel_name}</td>
                                                            <td>{$list_vo.sort}</td>
                                                            <td>{:date('Y-m-d H:i:s',$list_vo['created_at'])}</td>
                                                            <td>
                                                                <a class="btn btn-primary" href="javascript:;" title="编辑大区" onclick="openYemian('/admin.php/bigServer/edit?id={$list_vo.id}','编辑大区')"><i class="fa fa-pencil"></i>编辑大区</a>
                                                                <!-- <a class="btn btn-danger" href="javascript:void(0)" title="删除" data-url="{:U('channel/ajax_delete')}" data-id="{$vo.id}" <if condition="in_array('3',$user_root['function_id'])">  onclick="delarticle(this,'确定删除该渠道？',{$vo.id},'{:U('channel/ajax_delete')}')" <else/> onclick="layer.msg('没有操作权限', {icon: 5})" </if>><i class="fa fa-trash-o"></i></a> -->
                                                            </td>
                                                         </tr>
                                                    </volist>
                                                </tbody>
                                            </table>
                                            </form>
                                            <div>
                                                <div style="margin-top:20px;width: 100%;" id="pagelist">{$page}<span style="float:right;">共{$count}条</span></div>
                                            </div>
                                            <script>
                                                // 点击分页触发的事件
                                                $(".pagination a").click(function(){
                                                    url = $(this).attr('href');
                                                    ajax_get_table('formSearch',url);
                                                    return false;
                                                });
                                            </script>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function ajax_search(){
        $('#formSearch').submit();
    }


    //getAjaxList('ajaxList',1,"/admin.php/navlist/ajaxArticleList");

    // ajax 抓取页面 form 为表单id  page 为当前第几页
    function ajax_get_table(form,url){
        // cur_page = page; //当前页面 保存为全局变量
        // var info = $('#page_info').val();
        $.ajax({
            type : "POST",
            url:url,
            data : $('#'+form).serialize(),// 你的formid
            success: function(data){
                $("#ajaxList").html('');
                $("#ajaxList").append(data);
            }
        });
        return false;
    }

</script>


<include file="Public:footer" />
