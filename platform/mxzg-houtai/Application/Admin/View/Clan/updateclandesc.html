<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>编辑公会公告</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('Clan/ajax_UpdateClanDesc')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                        <div class="tab-pane active">

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>公会ID：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" value="{$clan_info.clan_id}" type="text" required="" aria-required="true" disabled>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器ID：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" value="{$clan_info.sid}" type="text" required="" aria-required="true" disabled>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>内容：</label>
                                <div class="col-sm-8" >
                                    <textarea style="height: 300px;" placeholder="请输入内容" name="clan_desc" class="configInput form-control" required="" aria-required="true">{$clan_info.clan_desc}</textarea>
                                </div>
                            </div>
              
                        </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="clan_id" value="{$clan_info.clan_id}">
                                    <input type="hidden" name="sid" value="{$clan_info.sid}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('Clan/ajax_UpdateClanDesc')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div> 
<script language="javascript">
    
</script>



<include file="Public:footer" />
