<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>扣除充值或道具</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('ReloadConfig/ajax_CostRechargeItem')}" method="post" id="artkindFrom" class="form-horizontal">
                            <div class="tab-content">
                                <div class="tab-pane active">

                                    <div class="form-group">
                                        <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>扣除类型：</label>
                                        <div class="col-sm-8">
                                            <select class="form-control type-type" name="type" onchange="serverType(this)">
                                                <option value="1">扣除充值</option>
                                                <option value="2">扣除道具</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>区服：</label>
                                        <div class="col-sm-8">
                                            <select class="form-control" name="sid">
                                                <option value="0">请选择区服</option>
                                                <volist name="server_list" id="server_list_vo">
                                                    <option value="{$server_list_vo.id}">{$server_list_vo.id}--{$server_list_vo.server_name}</option>
                                                </volist>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>角色id：</label>
                                        <div class="col-sm-8">
                                            <input class="configInput form-control" name="role_id" type="text" required="" aria-required="true">
                                        </div>
                                    </div>
                                    <div class="form-group cost-recharge">
                                        <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>总值（单位分）：</label>
                                        <div class="col-sm-8">
                                            <input style="width: 150px; float: left;" class="configInput form-control" name="total" type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,"")">
                                        </div>
                                    </div>
                                    <!-- <div class="form-group cost-recharge">
                                        <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>周值（单位分）：</label>
                                        <div class="col-sm-8">
                                            <input style="width: 150px; float: left;" class="configInput form-control" name="week" type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,"")">
                                        </div>
                                    </div>
                                    <div class="form-group cost-recharge">
                                        <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>日值（单位分）：</label>
                                        <div class="col-sm-8">
                                            <input style="width: 150px; float: left;" class="configInput form-control" name="daily" type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,"")">
                                        </div>
                                    </div> -->


                                    <div class="form-group cost-item">
                                        <label class="col-sm-2 control-label">选择道具：</label>
                                        <div class="col-sm-8 class-item">
                                            <a class="add_item"><i class="fa fa-plus"></i>添加道具</a>
                                            <p></p>
                                            <div class="col-sm-10">
                                                <a style="width: 80px; float: left;" class="del_item"><i class="fa fa-minus-square"></i>删除道具</a>

                                                <input type="hidden" name="item_type[]" value="">
                                                <select class="selectpicker form-control item_type" data-style="btn-info" data-title="请选择道具" data-live-search="true" >
                                                    <volist name="item_data" id="item_data_vo">
                                                        <option value="{$item_data_vo.id}">{$item_data_vo.id}--{$item_data_vo.name}</option>
                                                    </volist>
                                                </select>
                                                <input style="width: 90px; float: left;" class="configInput form-control" name="gift_item_num[]" type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,"")">
                                                
                                                
                                            </div>
                                        </div>
                                    </div>

                                </div>
                                <div class="hr-line-dashed"></div>
                                <div class="form-group">
                                    <div class="col-sm-4 col-sm-offset-2">
                                        <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('ReloadConfig/ajax_CostRechargeItem')}')" type="button">提交</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>

<script language="javascript">

    $(function(){
        serverType($('.type-type'));
        // upitem($('.item_type_type'));
    });

    $ (function () {
        $(document).on('change', ".item_type", function(e){
            var sid_str = '';
            $(this).find("option:selected").each(function () {
                sid_str += $(this).val() + ",";
            })
            if(sid_str != ''){
                sid_str = sid_str.slice(0,-1);
            }
            $(this).parent().prev().val(sid_str);
            // doMultipleSelection(this, 'product_id');
        })

        $(document).on('click', '.add_item', function() {
            var htmladd="";
            htmladd +='<div class="col-sm-10">';
            htmladd +='<a style="width: 80px; float: left;" class="del_item"><i class="fa fa-minus-square"></i>删除道具</a>';
            htmladd +='<input type="hidden" name="item_type[]" value="">';
            htmladd +='<select class="selectpicker form-control item_type" data-style="btn-info" data-title="请选择道具" data-live-search="true">';
            htmladd +='<volist name="item_data" id="item_data_vo">';
            htmladd +='<option value="{$item_data_vo.id}">{$item_data_vo.id}--{$item_data_vo.name}</option>';
            htmladd +='</volist></select>';
            htmladd +='<input style="width: 90px; float: left;" class="configInput form-control" name="gift_item_num[]" type="number" min="1" onkeyup="this.value=value.replace(/^(0+)|[^\d]+/g,"")">';
            htmladd +='</div>';
            $('.class-item').append(htmladd);
            $('.item_type').selectpicker('refresh');
            // upitem($('.item_type_type:last'));
        });
        $(document).on('click', '.del_item', function() {
            $(this).parent().remove();
        });
    });


    function serverType(obj){
        var selectedValue = $(obj).val();
        if(selectedValue == 1){     //
            $(".cost-recharge").show();
            $(".cost-item").hide();
        }else{
            $(".cost-recharge").hide();
            $(".cost-item").show();
        }
    }

</script>


<include file="Public:footer" />
