<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>热更--更新后端代码</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('reloadConfig/ajax_hot_reload')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                            <div class="tab-pane active">

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器：</label>

                                    <!-- 服务器全选html代码 -->
                                    <include file="Public:servercheckall" />
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>特殊服务器：</label>
                                    <div class="col-sm-8">
                                        <volist name="special_server_list" id="special_server_list_vo">
                                            <div>
                                                <div class="checkbox">
                                                    <label>
                                                        <input style="width: 21px;height: 21px;" class="check-all" type="checkbox" >
                                                        全选
                                                    </label>
                                                </div>
                                                <div class="checkbox checkbox-inline">
                                                    <volist name="special_server_list_vo" id="special_server_list_vo_vo">
                                                        <label>
                                                            <input style="width: 21px;height: 21px;" type="checkbox" class="server-check" name="special_server_ids[]" value="{$special_server_list_vo_vo['id']}"  >
                                                            {$special_server_list_vo_vo['server_name']}
                                                        </label>
                                                    </volist>
                                                </div>
                                            </div>
                                        </volist>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">热更内容：</label>
                                    <div class="col-sm-8">
                                        <span style="font-size: 25px;color:coral;">更新后端代码</span>
                                    </div>
                                </div>

                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('reloadConfig/ajax_hot_reload')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>
<!-- 服务器全选js代码 -->
<script type="text/javascript" src="/Public/static/admin/js/servercheckall.js"></script>

<script language="javascript">

</script>


<include file="Public:footer" />
