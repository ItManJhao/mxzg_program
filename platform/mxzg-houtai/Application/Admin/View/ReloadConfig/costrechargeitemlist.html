<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>扣除充值或道具日志</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="box">
                                <div class="box-header">
                                    <div class="panel-body">
                                        <form id="formSearch" style="width: auto;display: inline-block;" action="{:U('ReloadConfig/CostRechargeItemList')}" method="get" class="form-horizontal form-inline">

                                            <label class="control-label" style="padding-left: 5px;">服务器</label>
                                            <input type="hidden" name="sid" value="{$search_params['sid']}">
                                            <select class="selectpicker form-control sid" data-style="btn-info" data-title="请选择服务器" multiple data-live-search="true" data-selected-text-format="count>3" data-actions-box="true">
                                                <volist name="servers" id="servers_vo">
                                                    <if condition="!empty($search_params['sid']) && in_array($servers_vo['id'],explode(',', $search_params['sid']))">
                                                        <option value="{$servers_vo.id}" selected>{$servers_vo.id}--{$servers_vo.server_name}</option>
                                                        <else />
                                                        <option value="{$servers_vo.id}">{$servers_vo.id}--{$servers_vo.server_name}</option>
                                                    </if>
                                                </volist>
                                                </if>
                                            </select>

                                            <label class="control-label">角色id：</label>
                                            <input type="text" placeholder="精确搜索" name="role_id" value="{$search_params.role_id}" style="width: 120px;" class="form-control">

                                            <label class="control-label" style="padding-left: 7px;">扣除类型</label>
                                            <select class="form-control server-type" name="type">
                                                <option value="1" <if condition="$search_params['type'] == 1"> selected </if>>扣除充值</option>
                                                <option value="2" <if condition="$search_params['type'] == 2"> selected </if>>扣除道具</option>
                                            </select>

                                            <button type="button" style="margin-left:30px" onclick="ajax_search()" id="btn_query" class="btn btn-primary">查询</button>
                                            <button onclick="openYemian('{:U('ReloadConfig/CostRechargeItem')}','添加扣除')" type="button" class="btn btn-primary" style="float: right;margin-right:10px;"><i class="fa fa-plus"></i>添加扣除</button>
                                        </form>
                                        <div style="background:#C0C0C0; font-size: 14px; margin-top: 12px;"  >
                                            <div style="padding-top: 10px;padding-left: 15px;">
                                                <label class="control-label" >服务器：</label>
                                                <span class="sid-text">
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="box-body">
                                    <div class="row">
                                        <div class="col-sm-12" style="overflow:scroll;">
                                            <form method="post" enctype="multipart/form-data" id="form-order">
                                                <if condition="empty($list) neq true">
                                                    <table class="table table-bordered">
                                                        <thead>
                                                        <tr>
                                                            <volist name="list_title" id="list_title_vo">
                                                                <th>{$list_title_vo}</th>
                                                            </volist>
                                                        </tr>
                                                        </thead>
                                                        <tbody id="ajaxList">
                                                        <volist name="list" id="list_vo">
                                                            <tr role="row">
                                                                <volist name="list_vo" id="list_vo_vo">
                                                                    <td>{$list_vo_vo}</td>
                                                                </volist>
                                                            </tr>
                                                        </volist>
                                                        </tbody>
                                                    </table>
                                                <else />
                                                    <p style="text-align: center; color: red;font-size:20px;">{$error_msg}</p>
                                                </if>
                                            </form>
                                            <div>
                                                <div style="margin-top:20px;width: 100%;" id="pagelist">{$page}<span style="float:right;">共{$count}条</span></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>

<script>
    function ajax_search(){
        $('#formSearch').submit();
    }

    $(function(){
        doMultipleSelection($('.sid'), 'sid');
    });
    $(".sid").on('change',function(e){
        doMultipleSelection(this, 'sid');
    })

</script>

<include file="Public:footer" />
