<include file="Public:header" />


<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>渠道服务器列表</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="box">
                                <div class="box-header">  
                                    <div class="panel-body">
                                        <form id="formSearch" style="width: auto;display: inline-block;" action="{:U('channelServer/index')}" method="get" class="form-horizontal form-inline">
                                            <label class="control-label">渠道：</label>
                                            <select class="form-control" name="c_son_id">
                                                <option value="0">请选择渠道</option>
                                                <volist name="channels" id="channels_vo">
                                                    <eq name="channels_vo.id" value="$search_params.c_son_id">
                                                        <option value="{$channels_vo.id}" selected>{$channels_vo.name}</option>
                                                        <else />
                                                        <option value="{$channels_vo.id}">{$channels_vo.name}</option>
                                                    </eq>
                                                </volist>
                                                </if>
                                            </select>
                                            <label class="control-label">服务器：</label>
                                            <select class="form-control" name="sid">
                                                <option value="0">请选择服务器</option>
                                                <volist name="servers" id="servers_vo">
                                                    <eq name="servers_vo.id" value="$search_params.sid">
                                                        <option value="{$servers_vo.id}" selected>{$servers_vo.server_name}</option>
                                                        <else />
                                                        <option value="{$servers_vo.id}">{$servers_vo.server_name}</option>
                                                    </eq>
                                                </volist>
                                                </if>
                                            </select>
<!--                                            <label class="control-label">设备类型：</label>-->
<!--                                            <select class="form-control" name="device_type">-->
<!--                                                <option <if condition="$search_params['device_type'] == 0"> selected </if> value="0">所有设备类型</option>-->
<!--                                                <option <if condition="$search_params['device_type'] == 1"> selected </if> value="1">安卓</option>-->
<!--                                                <option <if condition="$search_params['device_type'] == 2"> selected </if> value="2">ios</option>-->
<!--                                            </select>-->
                                            <label class="control-label">显示名称：</label>
                                            <input type="text" placeholder="模糊搜索" name="show_name" value="{$search_params.show_name}" style="width: 120px;" class="form-control">
                                            <label class="control-label">渠道显示的序号sort：</label>
                                            <input type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,'')" placeholder="精确搜索" name="sort" value="{$search_params.sort}" style="width: 120px;" class="form-control">
                                            <button type="button" style="margin-left:30px" onclick="ajax_search()" id="btn_query" class="btn btn-primary">查询</button>
                                        </form>
                                        <button onclick="window.location.href=location.href;"  class="btn btn-primary " style="float: right;margin-right:10px;"><i class="glyphicon glyphicon-refresh"></i>刷新</button>
                                        <button onclick="openYemian('{:U('channelServer/add')}','添加渠道')" type="button" class="btn btn-primary" style="float: right;margin-right:10px;"><i class="fa fa-plus"></i>添加</button>
                                    </div>
                                </div>
                                <div class="box-body">
                                    <div class="row">
                                        <div class="col-sm-12">
                                            <form method="post" enctype="multipart/form-data" id="form-order">
                                            <table class="table table-bordered">
                                                <thead>
                                                    <tr>
                                                        <th style="width: 1px;"><input type="checkbox" onclick="$('input[name*=\'ids\']').prop('checked', this.checked);"></th>
                                                        <th width="5%">主键ID</th>
                                                        <th>渠道名称</th>
                                                        <th>大区名称</th>
                                                        <th>小区名称</th>
                                                        <th>小区显示名称</th>
                                                        <th>渠道显示的序号sort</th>
                                                        <th>创建时间</th>
                                                        <th>操作</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="ajaxList">
                                                    <volist name="list" id="list_vo">
                                                        <tr role="row"> 
                                                            <td><input type="checkbox" name="ids[]" value="{$list_vo.id}"></td>
                                                            <td>{$list_vo.id}</td>
                                                            <td>{$list_vo.c_son_id}--{$list_vo.channel_name}</td>
                                                            <td>{$list_vo.big_server_name}</td>
                                                            <td>{$list_vo.sid}--{$list_vo.server_name}</td>
                                                            <td>{$list_vo.show_name}</td>
                                                            <td>{$list_vo.sort}</td>
                                                            <td>{:date('Y-m-d H:i:s',$list_vo['created_at'])}</td>
                                                            <td>
                                                                <a class="btn btn-primary" href="javascript:;" title="编辑" onclick="openYemian('/admin.php/channelServer/edit?id={$list_vo.id}','编辑渠道服务器')"><i class="fa fa-pencil"></i>编辑</a>
                                                                <a class="btn btn-danger" href="javascript:void(0)" title="删除" data-url="{:U('ChannelServer/ajax_delete')}" data-id="{$list_vo.id}"  onclick="ChannelServerDelete(this,'确定删除吗？','{:U('ChannelServer/ajax_delete')}')" ><i class="fa fa-trash-o"></i>删除</a>
                                                            </td>
                                                         </tr>
                                                    </volist>
                                                </tbody>
                                            </table>
                                            </form>
                                            <div>
                                                <div style="margin-top:20px;width: 100%;" id="pagelist">{$page}<span style="float:right;">共{$count}条</span></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function ajax_search(){
        $('#formSearch').submit();
    }


    function ChannelServerDelete(obj,name,url) {
        top.layer.confirm(name,{
            icon : 3,
            btn:['确定','取消'],
        } , function(){
            var id=$(obj).attr("data-id");
            $.ajax({
                url : url,
                type : "post",
                data : {id:id},
                dataType : "json",
                success:function(data){
                    top.layer.alert(data.message, {icon: 6});
                    // if (data.status == 0) {
                    //     top.layer.msg(data.message);
                    // } else {
                    //     top.layer.msg(data.message);
                    //     // $(obj).parent().parent().remove();
                    // }
                    window.location.reload();
                }
            });
        } , function(){
            layer.close(); //再执行关闭
        })
    }

</script>


<include file="Public:footer" />
