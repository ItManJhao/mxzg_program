<include file="Public:header" />

<body class="fixed-sidebar full-height-layout gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>修改密码</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="" method="post" id="LoginForm" class="form-horizontal" onSubmit="return adminLogin()">
                        <div class="tab-content">
                            <div class="tab-pane active">

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>旧密码：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="old_password" type="text" required="" aria-required="true">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>新密码：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="new_password" type="text" required="" aria-required="true">
                                    </div>
                                </div>

                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <button class="btn btn-primary block full-width m-b" type="submit" >提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>
<script language="javascript">
    function adminLogin() {
        var old_password = $("input[name=old_password]").val();
        var new_password = $("input[name=new_password]").val();
        $.post('/admin.php/Login/ajax_updatepw.html', {old_password:old_password,new_password:new_password}, function(data){
            if (data.status == 1) {
                alert(data.message);
                window.location.href = data.url;
            } else {
                alert(data.message)
            }
            return false;
        });
        return false;
    }
</script>


<include file="Public:footer" />
