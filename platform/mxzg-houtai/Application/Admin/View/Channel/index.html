<include file="Public:header" />


<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>渠道列表</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="box">
                                <div class="box-header">  
                                    <div class="panel-body">
                                        <form id="formSearch" style="width: auto;display: inline-block;" action="{:U('channel/index')}" method="get" class="form-horizontal form-inline">
                                            <label class="control-label">渠道id：</label>
                                            <input type="text" placeholder="精确搜索" name="id" value="{$search_params.id}" style="width: 120px;" class="form-control">
                                            <label class="control-label">渠道名称：</label>
                                            <input type="text" placeholder="模糊搜索" name="name" value="{$search_params.name}" style="width: 120px;" class="form-control">
                                            <label class="control-label">大渠道名称：</label>
                                            <input type="text" placeholder="模糊搜索" name="parent_name" value="{$search_params.parent_name}" style="width: 120px;" class="form-control">
                                            <button type="button" style="margin-left:30px" onclick="ajax_search()" id="btn_query" class="btn btn-primary">查询</button>
                                        </form>
                                        <button onclick="window.location.href=location.href;"  class="btn btn-primary " style="float: right;margin-right:10px;"><i class="glyphicon glyphicon-refresh"></i>刷新</button>
                                        <button onclick="openYemian('{:U('channel/add')}','添加渠道')" type="button" class="btn btn-primary" style="float: right;margin-right:10px;"><i class="fa fa-plus"></i>添加</button>
                                    </div>
                                </div>
                                <div class="box-body">
                                    <div class="row">
                                        <div class="col-sm-12">
                                            <form method="post" enctype="multipart/form-data" id="form-order">
                                            <table class="table table-bordered">
                                                <thead>
                                                    <tr>
                                                        <th style="width: 1px;"><input type="checkbox" onclick="$('input[name*=\'ids\']').prop('checked', this.checked);"></th>
                                                        <th width="5%">渠道ID</th>
                                                        <th>渠道名称</th>
                                                        <th>渠道备注</th>
                                                        <th>所属大渠道</th>
                                                        <th>修改时间</th>
                                                        <th>创建时间</th>
                                                        <th>操作</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="ajaxList">
                                                    <volist name="list" id="vo">
                                                        <tr role="row"> 
                                                            <td><input type="checkbox" name="ids[]" value="{$vo.id}"></td>
                                                            <td>{$vo.id}</td>
                                                            <td>{$vo.name}</td>
                                                            <td>{$vo.desc}</td>
                                                            <td>
                                                                <if condition="$vo['parent_id'] neq 0">
                                                                    {$vo.parent_id}--{$vo.parent_name}
                                                                </if>
                                                            </td>
                                                            <td>{:date('Y-m-d H:i:s',$vo['updated_at'])}</td>
                                                            <td>{:date('Y-m-d H:i:s',$vo['created_at'])}</td>
                                                            <td>
                                                                <a class="btn btn-primary" href="javascript:;" title="编辑渠道" onclick="openYemian('/admin.php/channel/edit?id={$vo.id}','编辑渠道')"><i class="fa fa-pencil"></i>编辑渠道</a>
                                                                <!-- <a class="btn btn-danger" href="javascript:void(0)" title="删除" data-url="{:U('channel/ajax_delete')}" data-id="{$vo.id}" <if condition="in_array('3',$user_root['function_id'])">  onclick="delarticle(this,'确定删除该渠道？',{$vo.id},'{:U('channel/ajax_delete')}')" <else/> onclick="layer.msg('没有操作权限', {icon: 5})" </if>><i class="fa fa-trash-o"></i></a> -->
                                                            </td>
                                                         </tr>
                                                    </volist>
                                                </tbody>
                                            </table>
                                            </form>
                                            <div>
                                                <div style="margin-top:20px;width: 100%;" id="pagelist">{$page}<span style="float:right;">共{$count}条</span></div>
                                            </div>
                                            <script>
                                                // 点击分页触发的事件
                                                $(".pagination a").click(function(){
                                                    url = $(this).attr('href');
                                                    ajax_get_table('formSearch',url);
                                                    return false;
                                                });
                                            </script>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<input id="handle_status" value="" hidden="hidden">
<input id="kind_id" value="0" hidden="hidden">
 
<script>
    function changeOrder(obj,id,table,type,type_id){
        var order = $(obj).val();
        $.post("{:U('Public/order')}",{id:id,order:order,table:table,type:type,type_id:type_id},function (data){
            if(data.status == 1){
                layer.msg(data.msg, {icon: 6});
            }else{
                layer.msg(data.msg, {icon: 5});
            }
        });
    }
    function ajax_search(){
        $('#formSearch').submit();
    }

    function ajax_updata_status(id,obj) {
        var status = $(obj).attr('data-status');
        if (status == 1) {
            status = 0;
        }else{
            status = 1;
        }
        $.ajax({
            url : "{:U('adminlist/ajax_updata_status')}",
            type : "post",
            data : {id:id,status:status},
            dataType : "json",
            success:function(data){
                if (data.status == 0) { 
                    top.layer.msg(data.message);
                } else {
                    top.layer.msg(data.message);
                    if (status == 0) {
                        $(obj).attr('src','/Public/static/admin/images/cancel.png').attr('data-status',status);
                    }else{
                        $(obj).attr('src','/Public/static/admin/images/yes.png').attr('data-status',status);
                    }
                }
            }
        });
    }

    function delarticle(obj,name,id,url) {
        top.layer.confirm(name,{
            icon : 3,
            btn:['确定','取消'],
        } , function(){
            $.ajax({
                url : url,
                type : "post",
                data : {id:id},
                dataType : "json",
                success:function(data){
                    if (data.status == 0) { 
                        top.layer.msg(data.message);
                    } else {
                        top.layer.msg(data.message);
                        $(obj).parent().parent().remove();
                    }
                }
            });
        } , function(){
            layer.close(); //再执行关闭 
        })
    }

    function copyarticle(obj,name,id,url) {
        top.layer.confirm(name,{
            icon : 3,
            btn:['确定','取消'],
        } , function(){
            $.ajax({
                url : url,
                type : "post",
                data : {article_id:id,act:'copy'},
                dataType : "json",
                success:function(data){
                    if (data.status == 0) { 
                        top.layer.msg(data.message);
                    } else {
                        top.layer.msg(data.message,{time:2000},function(){
                            window.location.href = location.href;
                        });
                    }
                }
            });
        } , function(){
            layer.close(); //再执行关闭 
        })
    }

    //getAjaxList('ajaxList',1,"/admin.php/navlist/ajaxArticleList");

    // ajax 抓取页面 form 为表单id  page 为当前第几页
    function ajax_get_table(form,url){
        // cur_page = page; //当前页面 保存为全局变量
        // var info = $('#page_info').val();
        $.ajax({
            type : "POST",
            url:url,
            data : $('#'+form).serialize(),// 你的formid
            success: function(data){
                $("#ajaxList").html('');
                $("#ajaxList").append(data);
            }
        });
        return false;
    }

    $(".kind_id").change(function(){
      var kind_id = $(this).val();
      $("#kind_id").val(kind_id);
    });
</script>


<include file="Public:footer" />
