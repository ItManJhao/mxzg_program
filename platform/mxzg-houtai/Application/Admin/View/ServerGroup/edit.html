<include file="Public:header" />


<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>分组内容</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('active/ajax_updata')}" method="post" id="artkindFrom" class="form-horizontal">
                            <div class="tab-content">

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>分组id：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="id" value="{$group_info.id}" type="text" required="" aria-required="true" disabled>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>分组名称：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="name" value="{$group_info.name}" type="text" required="" aria-required="true">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>是否是新分组：</label>
                                    <div class="col-sm-8">
                                        <select class="form-control server-type" name="is_new">
                                            <option value="0" <if condition="$group_info['is_new'] == 0"> selected </if>>否</option>
                                            <option value="1" <if condition="$group_info['is_new'] == 1"> selected </if>>是</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器：</label>
                                    <div class="col-sm-8">
                                        <div class="checkbox checkbox-inline">
                                            <volist name="server_list" id="server_list_vo">
<!--                                                <input type="checkbox" id="inlineCheckbox1" value="option1"> 选项 1-->
                                                <label>
                                                    <if condition="in_array($server_list_vo['id'], $group_info['sids'])">
                                                        <input style="width: 21px;height: 21px;" type="checkbox" name="server_ids[]" value="{$server_list_vo['id']}"  checked >
                                                        <else />
                                                        <input style="width: 21px;height: 21px;" type="checkbox" name="server_ids[]" value="{$server_list_vo['id']}" >
                                                    </if>
                                                {$server_list_vo['server_name']}
                                                </label>
                                            </volist>
                                        </div>
                                    </div>
                                </div>

                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="id" value="{$group_info.id}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('Group/ajax_updata')}')" type="button">保存</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div> 
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>
<script language="javascript">
    

</script>


<include file="Public:footer" />
