<include file="Public:header" />


<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>修改商品</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('VirtualRecharge/ajax_updataproduct')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                        <div class="tab-pane active">

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>商品ID：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" value="{$product_info.id}" type="text" required="" aria-required="true" disabled>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>第三方商品ID：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="three_product_id" value="{$product_info.three_product_id}" type="text" required="" aria-required="true" >
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>商品名称：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="product_name" value="{$product_info.product_name}" type="text" required="" aria-required="true">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>商品code：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="goods_id" value="{$product_info.goods_id}" type="text" required="" aria-required="true">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>商品金额/分：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="money" value="{$product_info.money}" type="text" required="" aria-required="true">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>商品美金金额/元：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="dollar_money" value="{$product_info.dollar_money}" type="text" required="" aria-required="true">
                                </div>
                            </div>
              
                        </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="id" value="{$product_info.id}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('VirtualRecharge/ajax_updataproduct')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div> 
<script language="javascript">
    
</script>



<include file="Public:footer" />
