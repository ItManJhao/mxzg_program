<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>邮件模板</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="box">
                                <div class="box-header">  
                                    <div class="panel-body">
                                        <form id="formSearch" style="width: auto;display: inline-block;" action="{:U('mailtemplate/index')}" method="get" class="form-horizontal form-inline">
                                            <label class="control-label">标题：</label>
                                            <input type="text" placeholder="模糊搜索" name="title" value="{$search_params.title}" style="width: 120px;" class="form-control">&nbsp;
                                            <button type="button" style="margin-left:30px;float: right;" onclick="ajax_search()" id="btn_query" class="btn btn-primary">查询</button>
                                        </form>
                                        <button onclick="window.location.href=location.href;"  class="btn btn-primary " style="float: right;margin-right:10px;"><i class="glyphicon glyphicon-refresh"></i>刷新</button>
                                        <button onclick="openYemian('{:U('mailtemplate/add')}','添加邮件模板')" type="button" class="btn btn-primary" style="float: right;margin-right:10px;"><i class="fa fa-plus"></i>添加邮件模板</button>
 
                                    </div>
                                </div>
                                <div class="box-body">
                                    <div class="row">
                                        <div class="col-sm-12">
                                            <form method="post" οnsubmit="return false;" enctype="multipart/form-data" id="form-order">
                                            <table class="table table-bordered">
                                                <thead>
                                                    <tr>
                                                        <th width="5%">模板ID</th>
                                                        <th>标题</th>
                                                        <th>内容</th>
                                                        <th>包裹</th>
                                                        <th>管理员</th>
                                                        <th>操作时间</th>
                                                        <th>操作</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="ajaxList">
                                                    <volist name="list" id="vo">
                                                        <tr role="row"> 
                                                            <td>{$vo.id}</td>
                                                            <td>{$vo.title}</td>
                                                            <td>{$vo.content}</td>
                                                            <td>{$vo.item_data}</td>
                                                            <th>{$vo.admin_name}</th>
                                                            <td>{:date('Y-m-d H:i:s',$vo['created_at'])}</td>
                                                            <td>
                                                                <a class="btn btn-primary" href="javascript:;" title="编辑" onclick="openYemian('/admin.php/mailtemplate/edit?id={$vo.id}','编辑邮件模板')" ><i class="fa fa-pencil"></i>编辑</a>
                                                            </td>
                                                         </tr>
                                                    </volist>
                                                </tbody>
                                            </table>
                                            </form>
                                            <div>
                                                <div style="margin-top:20px;width: 100%;" id="pagelist">{$page}<span style="float:right;">共{$count}条</span></div>
                                            </div>
                                            <script>
                                                // 点击分页触发的事件
                                                $(".pagination a").click(function(){
                                                    url = $(this).attr('href');
                                                    ajax_get_table('formSearch',url);
                                                    return false;
                                                });
                                            </script>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function ajax_search(){
        $('#formSearch').submit();
    }

    // ajax 抓取页面 form 为表单id  page 为当前第几页
    function ajax_get_table(form,url){
        // cur_page = page; //当前页面 保存为全局变量
        // var info = $('#page_info').val();
        $.ajax({
            type : "POST",
            url:url,
            data : $('#'+form).serialize(),// 你的formid
            success: function(data){
                $("#ajaxList").html('');
                $("#ajaxList").append(data);
            }
        });
        return false;
    }

</script>


<include file="Public:footer" />
