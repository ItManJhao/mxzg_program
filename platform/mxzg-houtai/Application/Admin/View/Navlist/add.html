<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>菜单内容</h5>
                </div>
                <div class="ibox-content">
                    <ul class="nav nav-tabs">
                        <li class="active"><a data-toggle="tab" href="#tab-1"> 基本信息</a></li>
                        <li class=""><a data-toggle="tab" href="#tab-2" style="display: none"> 栏目内容(英)</a>
                        </li>
                    </ul>
                    <br/>
                    <div class="row">
                        <form action="{:U('navlist/ajax_add')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                        <div id="tab-1" class="tab-pane active">
                            <div class="form-group">
                                <label class="col-sm-2 control-label">父级菜单：</label>
                                <div class="col-sm-8">
                                    <select class="form-control" name="pid">
                                            <option value="0">顶级分类</option>
                                            <volist name="cate" id="vo">
                                                <option <if condition="$vo['id'] == $re['pid']"> selected </if> value="{$vo.id}">{:str_repeat("└─",$vo['level'])}{$vo.name}</option>
                                            </volist>
                                        </if>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label">名称：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="name" type="text" value="{$re.name}" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label">url：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="url" type="text" value="{$re.url}" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label">状态：</label>
                                <div class="col-sm-8">
                                    <input name="status" type="radio" value="1" checked aria-required="true">显示&nbsp;&nbsp;&nbsp;
                                    <input name="status" type="radio" value="0" aria-required="true">不显示
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label">菜单类型：</label>
                                <div class="col-sm-8">
                                    <input name="type" type="radio" value="0" checked aria-required="true">后台菜单&nbsp;&nbsp;&nbsp;
                                    <input name="type" type="radio" value="1" aria-required="true">权限菜单
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label">排序：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="orderby" type="text" value="0" required="" aria-required="true">
                                </div>
                            </div>
              
                        </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="id" value="{$re.id}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('navlist/ajax_add')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div> 
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>
<script language="javascript">
    $('.i-checks').iCheck({
        checkboxClass: 'icheckbox_square-green',
        radioClass: 'iradio_square-green',
    });
</script>


<include file="Public:footer" />
