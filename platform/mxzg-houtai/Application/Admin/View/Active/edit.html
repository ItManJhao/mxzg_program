<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>活动内容</h5>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label" style="padding-left:120px;"><span style="color: red;">*&nbsp;</span>数据文件：</label>
                    <div class="col-sm-8">
                        <input type="file" name="fileName1" id="fileName1"/>
                        <p>

                        </p>
                        <input type="button" onclick="sendToUser()" id="sendToUser" value="上传文件" />
                    </div>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('active/ajax_updata')}" method="post" id="artkindFrom" class="form-horizontal">
                            <div class="tab-content">

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>数据文件名字：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" id="data_file" name="data_file" type="text" required="" aria-required="true" value="{$active_info.data_file}">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>活动id：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="id" value="{$active_info.id}" type="text" required="" aria-required="true" disabled>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>活动名称：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="name" value="{$active_info.name}" type="text" required="" aria-required="true">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">活动类型：</label>
                                    <div class="col-sm-8">
                                        <select class="form-control" name="type_id">
                                            <volist name="active_type" id="active_type_vo">
                                                <eq name="active_type_vo.id" value="$active_info.type_id">
                                                    <option value="{$active_type_vo.id}" selected>{$active_type_vo.id}--{$active_type_vo.name}</option>
                                                <else />
                                                    <option value="{$active_type_vo.id}">{$active_type_vo.id}--{$active_type_vo.name}</option>
                                                </eq>
                                            </volist>
                                            </if>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>活动描述：</label>
                                    <div class="col-sm-8">
                                        <textarea placeholder="请输入内容" name="desc" class="configInput form-control" required="" aria-required="true">{$active_info.desc}</textarea>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>数据列表：</label>
                                    <div class="col-sm-8" style="white-space: nowrap; overflow: hidden; overflow-x: scroll; -webkit-backface-visibility: hidden; -webkit-overflow-scrolling: touch;">
                                        <table class="table table-bordered">
                                            <tbody>
                                                <empty name="excel_data">
                                                    <tr><td>暂时没有数据</td></tr>
                                                <else />
                                                    <volist name="excel_data" id="excel_data_vo">
                                                        <tr>
                                                            <volist name="excel_data_vo" id="excel_data_son_vo">
                                                                <td>{$excel_data_son_vo}</td>
                                                            </volist>
                                                        </tr>
                                                    </volist>
                                                </empty>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>



                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="id" value="{$active_info.id}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('active/ajax_updata')}')" type="button">保存</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div> 
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>
<script language="javascript">

    

    function sendToUser(){ //在这里进行ajax 文件上传 用户的信息
        var $file1 = $("input[name='fileName1']").val();//用户文件内容(文件)
        // 判断文件是否为空
        if ($file1 == "") {
            alert("请选择上传的目标文件! ")
            return false;
        }
        //判断文件类型,我这里根据业务需求判断的是Excel文件
        var fileName1 = $file1.substring($file1.lastIndexOf(".") + 1).toLowerCase();
        var file_name = $("input[name='fileName1']")[0].files[0].name;
        if(fileName1 != "xls" && fileName1 !="xlsx"){
            alert("请选择Execl文件!");
            return false;
        }
        boo1 = true;
        var type = "file";
        var formData = new FormData();//这里需要实例化一个FormData来进行文件上传
        var timestamp = Date.parse(new Date());
        formData.append(type,$("#fileName1")[0].files[0]);
        formData.append('file_name_prefix', timestamp);
        $.ajax({
            type : "post",
            url : "{:U('active/excel_upload')}",
            data : formData,
            processData : false,
            contentType : false,
            success : function(data){
                if (data.status == 0) {
                    alert(data.message);
                }else{
                    $("input[name='userUrl']").val(data);
                    alert("文件上传成功!");
                    $('#data_file').val(timestamp + '_' + file_name);
                }}
        });
    }

</script>


<include file="Public:footer" />
