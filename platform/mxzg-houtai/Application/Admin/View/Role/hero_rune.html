<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">

                <div class="ibox-title">

                <div class="ibox-content">

                                            <volist name="hero_rune" id="hero_rune_vo">

                                                    <td>{$hero_rune_vo.type_name}</td>
                                                    <td>{$hero_rune_vo.quality}</td>
                                                    <td>{$hero_rune_vo.place}</td>
                                                    <td>{$hero_rune_vo.ability_id}</td>
                                                    <td>{$hero_rune_vo.skill}</td>
                                                </tr>
                                            </volist>
                                        </tbody>
                                    </table>

                                </div>
                            </div>
                        </form>

                </div>
            </div>
        </div>
