<div class="wrapper wrapper-content animated fadeInRight">

                                                            <th>品质</th>

                                                                <td>{$vo.item_name}</td>
                                                                <td>{$vo.quality}</td>

                                            <div>
                                                <div style="margin-top:20px;width: 100%;" id="pagelist">{$page}<span style="float:right;">共{$count}条</span></div>
                                            </div>
                                            <script>
                                                // 点击分页触发的事件
                                                $(".pagination a").click(function(){

                                                    ajax_get_table('formSearch',url);
                                                    return false;
                                                });
                                            </script>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>

<script>
    function ajax_search(){
        $('#formSearch').submit();
    }

    $(function(){
        serverType($('.server-type'));
        doMultipleSelection($('.c_son_id'), 'c_son_id');
        doMultipleSelection($('.item_type'), 'item_type');
        doMultipleSelection($('.game_event'), 'game_event');
    });
    $(".c_son_id").on('change',function(e){
        doMultipleSelection(this, 'c_son_id');
    })
    $(".item_type").on('change',function(e){
        doMultipleSelection(this, 'item_type');
    })
    $(".game_event").on('change',function(e){
        doMultipleSelection(this, 'game_event');
    })

    var mail_templates_str = '<?php echo json_encode($item_class_arr); ?>';
    mail_templates_object = JSON.parse(mail_templates_str);

    var search_params = '<?php echo json_encode($search_params); ?>';
    search_params_arr = JSON.parse(search_params);

    function serverType(obj){
        var selectedValue = $(obj).val();
        var item_html = "";
        var item_arr = search_params_arr.item_type.split(',');
        $.each(mail_templates_object[selectedValue], function (key, item) {
            if ($.inArray(item.id, item_arr) >= 0)
            {
                item_html +='<option value="' + item.id + '" selected>' + item.id + '--' + item.name + '</option>';
            }else{
                item_html +='<option value="' + item.id + '" >' + item.id + '--' + item.name + '</option>';
            }
        });

        $("select.item-type").empty();
        $("select.item-type").append(item_html);
        doMultipleSelection($('.item_type'), 'item_type');
        $('select.item_type').selectpicker('refresh');
    }

    $(".export").click(function(){
        var c_son_id = $("input[ name='c_son_id' ]").val();
        var sid = $(".sid option:selected").val();
        var oprate = $(".oprate option:selected").val();
        var item_class = $(".server-type option:selected").val();
        var item_type = $("input[ name='item_type' ]").val();
        var game_event = $("input[ name='game_event' ]").val();
        var start_time = $("#start_time").val(); 
        var end_time = $("#end_time").val();
        window.location.href="/admin.php/GameData/ItemStatisDetailsExport?c_son_id=" + c_son_id + "&sid=" + sid + "&game_event=" + game_event + "&item_class=" + item_class + "&item_type=" + item_type + "&oprate=" + oprate + "&start_time=" + start_time + "&end_time=" + end_time;
    });

</script>
