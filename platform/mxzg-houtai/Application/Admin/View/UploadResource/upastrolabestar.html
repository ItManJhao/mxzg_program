<include file="Public:header" />


<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>上传星盘对应星级</h5>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label" style="padding-left:80px;"><span style="color: red;">*&nbsp;</span>数据文件：</label>
                    <div class="col-sm-8">
                        <input type="file" name="fileName1" id="fileName1"/>
                        <p>
                        </p>
                        <input type="button" onclick="sendToUser()" id="sendToUser" value="上传文件" />
                        <img style="width:1000px;height: 300px;" src="/Public/static/admin/img/astrolabe_star.png" class="img-rounded">
                    </div>
                </div>
                <div class="ibox-content">

                    <div class="row">

                        <form action="{:U('UploadResource/ajax_UpAstrolabeStar')}" method="post" id="artkindFrom" class="form-horizontal">
                            <div class="tab-content">
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>数据文件名字：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" id="data_file" name="data_file" type="text" required="" aria-required="true" value="">
                                    </div>
                                </div>

                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('UploadResource/ajax_UpAstrolabeStar')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div> 
<script language="javascript">
    function sendToUser(){ //在这里进行ajax 文件上传 用户的信息
        var $file1 = $("input[name='fileName1']").val();//用户文件内容(文件)
        // 判断文件是否为空
        if ($file1 == "") {
            alert("请选择上传的目标文件! ")
            return false;
        }
        //判断文件类型,我这里根据业务需求判断的是Excel文件
        var fileName1 = $file1.substring($file1.lastIndexOf(".") + 1).toLowerCase();
        var file_name = $("input[name='fileName1']")[0].files[0].name;
        if(fileName1 != "xls" && fileName1 !="xlsx"){
            alert("请选择Execl文件!");
            return false;
        }
        boo1 = true;
        var type = "file";
        var formData = new FormData();//这里需要实例化一个FormData来进行文件上传
        formData.append(type,$("#fileName1")[0].files[0]);
        $.ajax({
            type : "post",
            url : "{:U('active/excel_upload')}",
            data : formData,
            processData : false,
            contentType : false,
            success : function(data){
                if (data.status===0) {
                    alert(data.message);
                }else{
                    $("input[name='userUrl']").val(data);
                    alert(data.message);
                    $('#data_file').val(file_name);
                }}
        });
    }

</script>



<include file="Public:footer" />
