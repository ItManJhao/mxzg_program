<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>数据总览--开服当天数据</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="box">
                                <div class="box-header">
                                    <div class="panel-body">
                                        <form id="formSearch" style="width: auto;display: inline-block;" action="{:U('OverviewOpen/index')}" method="get" class="form-horizontal form-inline">
                                            <label class="control-label">渠道</label>
                                            <select class="form-control" name="c_son_id">
                                                <option value="0">请选择子渠道</option>
                                                <volist name="channels" id="channels_vo">
                                                    <eq name="channels_vo.id" value="$search_params.c_son_id">
                                                        <option value="{$channels_vo.id}" selected>{$channels_vo.id}--{$channels_vo.name}</option>
                                                        <else />
                                                        <option value="{$channels_vo.id}">{$channels_vo.id}--{$channels_vo.name}</option>
                                                    </eq>
                                                </volist>
                                                </if>
                                            </select>

                                            <label class="control-label" style="padding-left: 5px;">服务器</label>
                                            <select class="form-control" name="sid">
                                                <option value="0">请选择服务器</option>
                                                <volist name="servers" id="servers_vo">
                                                    <eq name="servers_vo.id" value="$search_params.sid">
                                                        <option value="{$servers_vo.id}" selected>{$servers_vo.id}--{$servers_vo.server_name}</option>
                                                        <else />
                                                        <option value="{$servers_vo.id}">{$servers_vo.id}--{$servers_vo.server_name}</option>
                                                    </eq>
                                                </volist>
                                                </if>
                                            </select>

                                            <label class="control-label" style="padding-left: 5px;">开服日期</label>
                                            <input class="configInput form-control" style="width: 160px;" id="open_date" name="open_date" type="text" onclick="laydate({elem: '#open_date', istime: true, format: 'YYYY-MM-DD'})" required="" aria-required="true" value="{$search_params['open_date']}">

                                            <button type="button" style="margin-left:30px" onclick="ajax_search()" id="btn_query" class="btn btn-primary">查询</button>
                                        </form>
                                        <button onclick="window.location.href=location.href;"  class="btn btn-primary " style="float: right;margin-right:10px;"><i class="glyphicon glyphicon-refresh"></i>刷新</button>
                                    </div>
                                </div>
                                <div class="box-body">
                                    <div class="row">
                                        <div class="col-sm-12" style="overflow:scroll;">
                                            <form method="post" enctype="multipart/form-data" id="form-order">
                                                <if condition="empty($list) neq true">
                                                    <table class="table table-bordered">
                                                        <thead>
                                                        <tr>
                                                            <th>开服日期</th>
                                                            <th>注册数</th>
                                                            <th>创角数</th>
                                                            <th>创角转化率</th>
                                                            <th>登录人数</th>
                                                            <th>在线峰值</th>
                                                            <th>总付费人数</th>
                                                            <th>总付费</th>
                                                            <th>ARPPU</th>
                                                            <th>活跃ARPU</th>
                                                            <th>付费率</th>
                                                        </tr>
                                                        </thead>
                                                        <tbody id="ajaxList">
                                                        <volist name="list" id="vo">
                                                            <tr role="row">
                                                                <td>{$vo.open_time_show}</td>
                                                                <td>{$vo.register_num}</td>
                                                                <td>{$vo.role_num}</td>
                                                                <td>{$vo['add_role_rate']}%</td>
                                                                <td>{$vo.login_num}</td>
                                                                <td>{$vo.highest_online_num}</td>
                                                                <td>{$vo.pay_num}</td>
                                                                <td>{$vo.pay_money}</td>
                                                                <td>{$vo['arppu']}</td>
                                                                <td>{$vo['arpu']}</td>
                                                                <td>{$vo['rate']}%</td>
                                                            </tr>
                                                        </volist>
                                                        </tbody>
                                                    </table>
                                                <else />
                                                    <p style="text-align: center; color: red;font-size:20px;">{$error_msg}</p>
                                                </if>
                                            </form>
                                            <div>
                                                <div style="margin-top:20px;width: 100%;" id="pagelist">{$page}<span style="float:right;">共{$count}条</span></div>
                                            </div>
                                            <script>
                                                // 点击分页触发的事件
                                                $(".pagination a").click(function(){
                                                    url = $(this).attr('href');
                                                    ajax_get_table('formSearch',url);
                                                    return false;
                                                });
                                            </script>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>

<script>
    function ajax_search(){
        $('#formSearch').submit();
    }

    // ajax 抓取页面 form 为表单id  page 为当前第几页
    function ajax_get_table(form,url){
        // cur_page = page; //当前页面 保存为全局变量
        // var info = $('#page_info').val();
        $.ajax({
            type : "POST",
            url:url,
            data : $('#'+form).serialize(),// 你的formid
            success: function(data){
                $("#ajaxList").html('');
                $("#ajaxList").append(data);
            }
        });
        return false;
    }

</script>

<include file="Public:footer" />
