<script language="javascript">
 
 
    function check_all(ids,obj,type){
    
        if ($(obj).attr('data-status') == 0) {
 
            $(ids).children('input[type="checkbox"]').prop("checked", true);
            $(ids).children('.all').children('input[type="checkbox"]').prop("checked", true);
            $(ids).children('.all').children('.all2').children('input[type="checkbox"]').prop("checked", true);
            if (type == 1) {
                $(ids).children('.all').children('.max').attr('data-status',1);
            }
            $(obj).attr('data-status',1);

        }else{
            $(ids).children('input[type="checkbox"]').prop("checked", false);
            $(ids).children('.all').children('input[type="checkbox"]').prop("checked", false);
            $(ids).children('.all').children('.all2').children('input[type="checkbox"]').prop("checked", false);
            if (type == 1) {
                $(ids).children('.all').children('.max').attr('data-status',0);
            }
            $(obj).attr('data-status',0);
        }

        check_ids_all();
        check_ids_alls();
        check_ids_allss();
    }

    function check_ids_alls(){
        var num = 0;
        var nums = 0;
        $('#function_id').children('.all').children('input[type="checkbox"]').each(function(){
            num++;
            if ($(this).is(':checked')) {
                nums++;
            }
        })
        if (num != nums) {
            $('#function_id_all').attr('data-status',0).prop("checked", false);
        }else{
            $('#function_id_all').attr('data-status',1).prop("checked", true);
        }
    }

     function check_ids_allss(){
        var num = 0;
        var nums = 0;
        $('#channels_id').children('.all').children('input[type="checkbox"]').each(function(){
            num++;
            if ($(this).is(':checked')) {
                nums++;
            }
        })
        $('#channels_id').children('.all').children('.all2').children('input[type="checkbox"]').each(function(){
            num++;
            if ($(this).is(':checked')) {
                nums++;
            }
        })
        if (num != nums) {
            $('#channels_id_all').attr('data-status',0).prop("checked", false);
        }else{
            $('#channels_id_all').attr('data-status',1).prop("checked", true);
        }
    }

    function check_ids_all(){
        var num = 0;
        var nums = 0;
        $('#menu_id').children('.all').children('input[type="checkbox"]').each(function(){
            num++;
            if ($(this).is(':checked')) {
                nums++;
            }
        })
        $('#menu_id').children('.all').children('.all2').children('input[type="checkbox"]').each(function(){
            num++;
            if ($(this).is(':checked')) {
                nums++;
            }
        })
        if (num != nums) {
            $('#menu_id_all').attr('data-status',0).prop("checked", false);
        }else{
            $('#menu_id_all').attr('data-status',1).prop("checked", true);
        }
    }

    $('.menu_input').click(function(){
        var nums = 0;
        var num = 0;
        check_ids_all();

        $(this).parent().children('input[type="checkbox"]').each(function(){
            num++;
            if ($(this).is(':checked')) {
                nums++;
            }
        })
        if (nums == 0) {
            $('#'+$(this).parent().attr('id')+'_1').attr('data-status',0).prop("checked", false);
             check_ids_all();
        }
        if (nums == num) {
            check_ids_all();
            $('#'+$(this).parent().attr('id')+'_1').attr('data-status',1).prop("checked", true);
             check_ids_all();
        }
    })

    $('.function_input').click(function(){
        check_ids_alls();
        var nums = 0;
        var num = 0;
        $(this).parent().children('input[type="checkbox"]').each(function(){
            num++;
            if ($(this).is(':checked')) {
                nums++;
            }
        })
        if (nums == 0) {
            $('#'+$(this).parent().attr('id')+'_1').attr('data-status',0).prop("checked", false);
            check_ids_alls();
        }
        if (nums == num) {
            $('#'+$(this).parent().attr('id')+'_1').attr('data-status',1).prop("checked", true);
            check_ids_alls();
        }
    })

    $('.channels_input').click(function(){
        check_ids_allss();
        var nums = 0;
        var num = 0;
        $(this).parent().children('input[type="checkbox"]').each(function(){
            num++;
            if ($(this).is(':checked')) {
                nums++;
            }
        })
        if (nums == 0) {
            $('#'+$(this).parent().attr('id')+'_1').attr('data-status',0).prop("checked", false);
             check_ids_allss();
        }
        if (nums == num) {
            $('#'+$(this).parent().attr('id')+'_1').attr('data-status',1).prop("checked", true);
             check_ids_allss();
        }
    })


</script>

        });
