<script>
 
    function changeOrder(obj,id,table,type,type_id){
        var order = $(obj).val();
        $.post("{:U('Public/order')}",{id:id,order:order,table:table,type:type,type_id:type_id},function (data){
            if(data.status == 1){
                layer.msg(data.msg, {icon: 6});
            }else{
                layer.msg(data.msg, {icon: 5});
            }
        });
    }

    function ajax_search(){
        $('#formSearch').submit();
    }

    function ajax_updata_status(id,obj) {
        var status = $(obj).attr('data-status');
        if (status == 1) {
            status = 0;
        }else{
            status = 1;
        }
        $.ajax({
            url : "{:U('rootlist/ajax_updata_status')}",
            type : "post",
            data : {id:id,status:status},
            dataType : "json",
            success:function(data){
                if (data.status == 0) { 
                    top.layer.msg(data.message);
                } else {
                    top.layer.msg(data.message);
                    if (status == 0) {
                        $(obj).attr('src','/Public/static/admin/images/cancel.png').attr('data-status',status);
                    }else{
                        $(obj).attr('src','/Public/static/admin/images/yes.png').attr('data-status',status);
                    }
                }
            }
        });
    }

    function delarticle(obj,name,id,url) {
        top.layer.confirm(name,{
            icon : 3,
            btn:['确定','取消'],
        } , function(){
            $.ajax({
                url : url,
                type : "post",
                data : {id:id},
                dataType : "json",
                success:function(data){
                    if (data.status == 0) { 
                        top.layer.msg(data.message);
                    } else {
                        top.layer.msg(data.message);
                        $(obj).parent().parent().remove();
                    }
                }
            });
        } , function(){
            layer.close(); //再执行关闭 
        })
    }

    function copyarticle(obj,name,id,url) {
        top.layer.confirm(name,{
            icon : 3,
            btn:['确定','取消'],
        } , function(){
            $.ajax({
                url : url,
                type : "post",
                data : {article_id:id,act:'copy'},
                dataType : "json",
                success:function(data){
                    if (data.status == 0) { 
                        top.layer.msg(data.message);
                    } else {
                        top.layer.msg(data.message,{time:2000},function(){
                            window.location.href = location.href;
                        });
                    }
                }
            });
        } , function(){
            layer.close(); //再执行关闭 
        })
    }

    //getAjaxList('ajaxList',1,"/admin.php/navlist/ajaxArticleList");

    // ajax 抓取页面 form 为表单id  page 为当前第几页
    function ajax_get_table(form,url){
        // cur_page = page; //当前页面 保存为全局变量
        // var info = $('#page_info').val();
        $.ajax({
            type : "POST",
            url:url,
            data : $('#'+form).serialize(),// 你的formid
            success: function(data){
                $("#ajaxList").html('');
                $("#ajaxList").append(data);
            }
        });
        return false;
    }

    $(".kind_id").change(function(){
      var kind_id = $(this).val();
      $("#kind_id").val(kind_id);
    });
</script>
