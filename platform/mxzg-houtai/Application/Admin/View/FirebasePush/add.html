<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>添加消息推送</h5>
                </div>
                <div class="ibox-content">

                    <div class="row">

                        <form action="{:U('FirebasePush/ajax_add')}" method="post" id="artkindFrom" class="form-horizontal">
                            <div class="tab-content">
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>标题：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="title" type="text" required="" aria-required="true" value="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>内容：</label>
                                    <div class="col-sm-8">
                                        <textarea placeholder="请输入内容" name="content" class="configInput form-control" required="" aria-required="true"></textarea>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">系统：</label>
                                    <div class="col-sm-8">
                                        <label class="checkbox-inline i-checks">
                                            <input type="radio" name="system" value="0" checked="checked" >安卓</label>
                                        <label class="checkbox-inline i-checks">
                                            <input type="radio" name="system" value="1" >ios</label>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>消息类型：</label>
                                    <div class="col-sm-8">
                                        <select class="form-control server-type" name="is_broadcast" onchange="changeIsBroadcast(this)">
                                            <option value="0">用户消息</option>
                                            <option value="1">广播消息</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group only-push">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>平台uid集合（多个用英文逗号隔开）：</label>
                                    <div class="col-sm-8">
                                        <textarea placeholder="uid" name="user_ids" class="configInput form-control" required="" aria-required="true"></textarea>
                                    </div>
                                </div>

                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('FirebasePush/ajax_add')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div> 
<script language="javascript">

    function changeIsBroadcast(obj){
        var selectedValue = $(obj).val();
        if(selectedValue == 0){     //用户消息，展示填写用户uid
            $(".only-push").show();
        }else{
            $(".only-push").hide();
        }
    }

</script>


<include file="Public:footer" />
