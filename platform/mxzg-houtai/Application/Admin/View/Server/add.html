<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>添加游戏区服</h5>
                </div>
                <div class="ibox-content">
                    <ul class="nav nav-tabs">
                        <li class="active"><a data-toggle="tab" href="#tab-1"> 基本信息</a></li>
                        <li class=""><a data-toggle="tab" href="#tab-2">数据库信息</a>
                        </li>
                    </ul>
                    <br/>
                    <div class="row">
                        <form action="{:U('server/ajax_add')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                        <div id="tab-1" class="tab-pane active">

<!--                            <div class="form-group">-->
<!--                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>区服ID：</label>-->
<!--                                <div class="col-sm-8">-->
<!--                                    <input class="configInput form-control" name="ids" type="text" required="" aria-required="true">-->
<!--                                </div>-->
<!--                            </div>-->

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器名称：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="server_name" type="text" required="" aria-required="true">
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>分组：</label>
                                <div class="col-sm-8">
                                    <input style="width: 90px; float: left;" class="configInput form-control" name="group_id" type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,"")">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器外网地址：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="extranet_host" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>内网地址：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="intranet_host" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>游戏端口：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="game_port" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>HTTP端口：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="http_port" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label">服务器提示信息：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="msg" type="text" required="" aria-required="true">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label">备注：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="note" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>是否为新服：</label>
                                <div class="col-sm-8">
                                    <input name="is_new" type="radio" value="1" checked aria-required="true">是&nbsp;&nbsp;&nbsp;
                                    <input name="is_new" type="radio" value="0" aria-required="true">否
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器类型</label>
                                <div class="col-sm-8">
                                    <input name="type" type="radio" value="0" checked aria-required="true">正式服&nbsp;&nbsp;&nbsp;
                                    <input name="type" type="radio" value="1" aria-required="true">测试服
                                    &nbsp;&nbsp;&nbsp;
                                    <input name="type" type="radio" value="2" aria-required="true">审核服
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>状态：</label>
                                <div class="col-sm-8">
                                    <select class="form-control" name="status">
                                        <option value="0">未开放</option>
                                        <option value="1">爆满</option>
                                        <option value="2">流畅</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>创角人数阈值：</label>
                                <div class="col-sm-8">
                                    <input style="width: 90px; float: left;" class="configInput form-control" name="role_nums_limit" type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,"")">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>开服时间：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" id="open_time" name="open_time" type="text" onclick="laydate({elem: '#open_time', istime: true, format: 'YYYY-MM-DD hh:mm:ss'})" required="" aria-required="true" value="{:date('Y-m-d H:i:s')}">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>维护时间：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" id="defend_end_time" name="defend_end_time" type="text" onclick="laydate({elem: '#defend_end_time', istime: true, format: 'YYYY-MM-DD hh:mm:ss'})" required="" aria-required="true" value="{:date('Y-m-d H:i:s')}">
                                </div>
                            </div>

<!--                            <div class="form-group">-->
<!--                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>所属渠道：</label>-->
<!--                                <div class="col-sm-8">-->
<!--                                    <select class="form-control" name="channel_id" disabled="disabled"></select>-->
<!--                                </div>-->
<!--                            </div>-->


<!--                            <div class="form-group">-->
<!--                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>所属子渠道：</label>-->
<!--                                <div class="col-sm-8">-->
<!--                                    <select class="form-control" name="sub_channel_id" onchange="sel()">-->
<!--                                        <volist name="sub_cate" id="vo">-->
<!--                                            <option value="{$vo.id}">{$vo.name}</option>-->
<!--                                        </volist>-->
<!--                                    </select>-->
<!--                                </div>-->
<!--                            </div>-->


                        </div>

                        <div id="tab-2" class="tab-pane">

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>数据库地址：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="db_host" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>数据库端口：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="db_port" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>数据库用户名：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="db_user" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>数据库密码：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="db_password" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>游戏数据库名：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="db_game_database" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>游戏日志数据库名：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="db_log_database" type="text" required="" aria-required="true">
                                </div>
                            </div>
 
                        </div>

                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="id" value="{$re.id}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('server/ajax_add')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div> 
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>
<script language="javascript">

get_channel();
function get_channel(){
    var id = $('select[name="sub_channel_id"]').val();
    $.post("{:U('server/ajax_channel')}",{"id":id},function (data){
        if (data) {
            $('select[name="channel_id"]').html('<option value="'+data.id+'">'+data.name+'</option>');
            // console.log(data);
        }
    })
}

function sel(){
    get_channel();
}

</script>
    
    <script>
        $('.i-checks').iCheck({
            checkboxClass: 'icheckbox_square-green',
            radioClass: 'iradio_square-green',
        });
    </script>


<include file="Public:footer" />
