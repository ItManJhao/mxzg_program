<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>维护（踢下线）</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <form action="{:U('server/ajax_defend')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                            <div class="tab-pane active">

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器：</label>
                                    
                                    <!-- 服务器全选html代码 -->
                                    <include file="Public:servercheckall" />
                                </div>

                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>维护结束时间：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" id="defend_end_time" name="defend_end_time" type="text" onclick="laydate({elem: '#defend_end_time', istime: true, format: 'YYYY-MM-DD hh:mm:ss'})" required="" aria-required="true" value="{:date('Y-m-d H:i:s')}">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>维护通知：</label>
                                    <div class="col-sm-8">
                                        <input class="configInput form-control" name="msg" type="text" required="" aria-required="true">
                                    </div>
                                </div>

                            </div>
                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('server/ajax_defend')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>

<!-- 服务器全选js代码 -->
<script type="text/javascript" src="/Public/static/admin/js/servercheckall.js"></script>

<script language="javascript">
    
</script>


<include file="Public:footer" />
