<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>编辑游戏区服</h5>
                </div>
                <div class="ibox-content">
                    <ul class="nav nav-tabs">
                        <li class="active"><a data-toggle="tab" href="#tab-1"> 基本信息</a></li>
                        <li class=""><a data-toggle="tab" href="#tab-2">数据库信息</a>
                        </li>
                    </ul>
                    <br/>
                    <div class="row">
                        <form action="{:U('server/ajax_updata')}" method="post" id="artkindFrom" class="form-horizontal">
                        <div class="tab-content">
                        <div id="tab-1" class="tab-pane active">

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>区服ID：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="id" value="{$server_info.id}" disabled="disabled" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器名称：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="server_name" value="{$server_info.server_name}" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>分组：</label>
                                <div class="col-sm-8">
                                    <input style="width: 90px; float: left;" class="configInput form-control" name="group_id" value="{$server_info.group_id}" type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,"")">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器外网地址：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="extranet_host" value="{$server_info.extranet_host}" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>内网地址：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="intranet_host" value="{$server_info.intranet_host}" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>游戏端口：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="game_port" value="{$server_info.game_port}" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>HTTP端口：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="http_port" value="{$server_info.http_port}" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label">服务器提示信息：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="msg" value="{$server_info.msg}" type="text" required="" aria-required="true">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label">备注：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="note" value="{$server_info.note}" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>是否为新服：</label>
                                <div class="col-sm-8">
                                    <input name="is_new" type="radio" value="1" <if condition="$server_info['is_new'] == 1"> checked </if> aria-required="true">是&nbsp;&nbsp;&nbsp;
                                    <input name="is_new" type="radio" value="0" <if condition="$server_info['is_new'] == 0"> checked </if> aria-required="true">否
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>服务器类型：</label>
                                <div class="col-sm-8">
                                    <input name="type" type="radio" value="0" <if condition="$server_info['type'] == 0"> checked </if> aria-required="true">正式服&nbsp;&nbsp;&nbsp;
                                    <input name="type" type="radio" value="1" <if condition="$server_info['type'] == 1"> checked </if> aria-required="true">测试服&nbsp;&nbsp;&nbsp;
                                    <input name="type" type="radio" value="2" <if condition="$server_info['type'] == 2"> checked </if> aria-required="true">审核服
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>状态：</label>
                                <div class="col-sm-8">
                                    <select class="form-control" name="status">
                                        <option <if condition="$server_info['status'] == 0"> selected </if> value="0">未开放</option>
                                        <option <if condition="$server_info['status'] == 1"> selected </if> value="1">爆满</option>
                                        <option <if condition="$server_info['status'] == 2"> selected </if> value="2">流畅</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>创角人数阈值：</label>
                                <div class="col-sm-8">
                                    <input style="width: 90px; float: left;" class="configInput form-control" name="role_nums_limit" value="{$server_info.role_nums_limit}" type="number" min="1" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,"")">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>开服时间：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" id="open_time" name="open_time" type="text" onclick="laydate({elem: '#open_time', istime: true, format: 'YYYY-MM-DD hh:mm:ss'})" required="" aria-required="true" value="{:date('Y-m-d H:i:s',$server_info['open_time'])}">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>维护时间：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" id="defend_end_time" name="defend_end_time" type="text" onclick="laydate({elem: '#defend_end_time', istime: true, format: 'YYYY-MM-DD hh:mm:ss'})" required="" aria-required="true" value="{:date('Y-m-d H:i:s',$server_info['defend_end_time'])}">
                                </div>
                            </div>

<!--                            <div class="form-group">-->
<!--                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>所属渠道：</label>-->
<!--                                <div class="col-sm-8">-->
<!--                                    <select class="form-control" name="channel_id" disabled="disabled"></select>-->
<!--                                </div>-->
<!--                            </div>-->


<!--                            <div class="form-group">-->
<!--                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>所属子渠道：</label>-->
<!--                                <div class="col-sm-8">-->
<!--                                    <select class="form-control" name="sub_channel_id" onchange="sel()">-->
<!--                                            <volist name="sub_cate" id="vo">-->
<!--                                                <option <if condition="$re['sub_channel_id'] == $vo['id']"> selected </if> value="{$vo.id}">{$vo.name}</option>-->
<!--                                            </volist>-->
<!--                                    </select>-->
<!--                                </div>-->
<!--                            </div>-->


                        </div>

                        <div id="tab-2" class="tab-pane">

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>数据库地址：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="db_host" value="{$server_info.db_host}" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>数据库端口：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="db_port" value="{$server_info.db_port}" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>数据库用户名：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="db_user" value="{$server_info.db_user}" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>数据库密码：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="db_password" value="{$server_info.db_password}" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>游戏数据库名：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="db_game_database" value="{$server_info.db_game_database}" type="text" required="" aria-required="true">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span style="color: red;">*&nbsp;</span>游戏日志数据库名：</label>
                                <div class="col-sm-8">
                                    <input class="configInput form-control" name="db_log_database" value="{$server_info.db_log_database}" type="text" required="" aria-required="true">
                                </div>
                            </div>
 
                        </div>

                            <div class="hr-line-dashed"></div>
                            <div class="form-group">
                                <div class="col-sm-4 col-sm-offset-2">
                                    <input type="hidden" name="id" value="{$server_info.id}">
                                    <button class="btn btn-primary" onclick="update_form('artkindFrom','{:U('server/ajax_updata')}')" type="button">提交</button>
                                </div>
                            </div> 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div> 
<script type="text/javascript" src="/Public/static/admin/js/webupload.js"></script>
<script language="javascript">

</script>


<include file="Public:footer" />
