<include file="Public:header" />

<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>后台操作列表</h5>
                </div>
                <div class="ibox-content">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="box">
                                <div class="box-header">  
                                    <div class="panel-body">
                                        <form id="formSearch" style="width: auto;display: inline-block;" action="{:U('RequestLog/index')}" method="get" class="form-horizontal form-inline">
                                            <label class="control-label">操作名称：</label>
                                            <input type="text" placeholder="模糊搜索" name="url_name" value="{$search_params.url_name}" style="width: 120px;" class="form-control">
                                            <label class="control-label">管理员：</label>
                                            <input type="text" placeholder="模糊搜索" name="admin_name" value="{$search_params.admin_name}" style="width: 120px;" class="form-control">

                                            <button type="button" style="margin-left:30px" onclick="ajax_search()" id="btn_query" class="btn btn-primary">查询</button>
                                        </form>
                                        <button onclick="window.location.href=location.href;"  class="btn btn-primary " style="float: right;margin-right:10px;"><i class="glyphicon glyphicon-refresh"></i>刷新</button>
                                    </div>
                                </div>
                                <div class="box-body">
                                    <div class="row">
                                        <div class="col-sm-12">
                                            <form method="post" enctype="multipart/form-data" id="form-order">
                                            <table class="table table-bordered" style="table-layout:fixed;word-break:break-all;">
                                                <thead>
                                                    <tr>
                                                        <th style="width: 1px;"><input type="checkbox" onclick="$('input[name*=\'ids\']').prop('checked', this.checked);"></th>
                                                        <th width="5%">主键id</th>
                                                        <th>操作地址</th>
                                                        <th>操作名称</th>
                                                        <th width="30%">参数</th>
                                                        <th>管理员id</th>
                                                        <th>管理员名称</th>
                                                        <th>操作时间</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="ajaxList">
                                                    <volist name="list" id="vo">
                                                        <tr role="row"> 
                                                            <td><input type="checkbox" name="ids[]" value="{$vo.role_id}"></td>
                                                            <td>{$vo.id}</td>
                                                            <td>{$vo.url}</td>
                                                            <td>{$vo.url_name}</td>
                                                            <td >{$vo.params}</td>
                                                            <td>{$vo.admin_id}</td>
                                                            <td>{$vo.admin_name}</td>
                                                            <td>{:date('Y-m-d H:i:s',$vo['created_at'])}</td>

                                                         </tr>
                                                    </volist>
                                                </tbody>
                                            </table>
                                            </form>
                                            <div>
                                                <div style="margin-top:20px;width: 100%;" id="pagelist">{$page}<span style="float:right;">共{$count}条</span></div>
                                            </div>
                                            <script>
                                                // 点击分页触发的事件
                                                $(".pagination a").click(function(){
                                                    url = $(this).attr('href');
                                                    ajax_get_table('formSearch',url);
                                                    return false;
                                                });
                                            </script>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function ajax_search(){
        $('#formSearch').submit();
    }

    // ajax 抓取页面 form 为表单id  page 为当前第几页
    function ajax_get_table(form,url){
        // cur_page = page; //当前页面 保存为全局变量
        // var info = $('#page_info').val();
        $.ajax({
            type : "POST",
            url:url,
            data : $('#'+form).serialize(),// 你的formid
            success: function(data){
                $("#ajaxList").html('');
                $("#ajaxList").append(data);
            }
        });
        return false;
    }

</script>

<include file="Public:footer" />
