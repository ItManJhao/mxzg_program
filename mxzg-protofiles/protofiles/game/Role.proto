package protocol;
option java_package = "com.ayjs.mxzg.protocol";
option java_outer_classname = "RoleGMsg";
import "Hero.proto";
import "Object.proto";


message ResNoticeData
{
	optional int32 type = 1; 			// 1,公告，2跑马灯
	optional int32 interval_time = 2;	// 跑马灯间隔时间（秒）
	optional string title = 3;			//标题
	optional string notice = 4;			//内容
	optional int32 sta_time = 5;		//开始时间
	optional int32 end_time = 6;		//结束时间
}

//请求玩家信息
//2001
message GReqRoleInfo
{
}

//2001
message GResRoleInfo
{
	optional int64 gem = 1;			//宝石
	optional int64 gold = 2;		//金币
	optional int32 energy = 3;		//精力
	optional int64 exp = 4;			//经验
	optional int32 cup = 5;			//奖杯
	optional int32 level = 6;		//等级
	optional int32 head_id = 7;		//头像
	optional int32 image_id = 8;	//形象ID
	optional string nick = 9; 		//昵称
	optional int32 last_request_time = 10;	//最后登录时间时间
	optional int32 lang = 11;		//语言
	optional int32 create_time = 12;//创号时间
	optional int64 clan_id = 13;	//军团ID
	optional int32 is_edit_name = 14;//玩家是否改名(0.否 1.是)
	repeated int32 serial = 15;		 //新手指引数字类型
	optional int32 server_create_time = 16;//开服时间
	optional int32 goddess_vip = 19;//VIP等级
	optional int64 hero_exp = 20;	//英雄经验
	optional int64 recharge = 21;   //累充金额
	optional int32 border_id = 22;	//头像框
	optional int32 fighting = 23;	//战斗力
	repeated string serial_str = 24;//新手指引字符类型
	optional int32 area_id = 25; 	//区域id,关联到省指定城市
	optional int64 super_gem = 26;	//超级钻石(虹石)
	optional int64 clergy_exp = 27;		//神权经验
	optional int32 clergy_level = 28;		//解锁的神权特权等级
	optional int32 peerage_status = 29;		//尊贵标识是否在聊天中展示（0.否 1.是）
	optional int32 peerage_level = 30;		//尊贵标识等级
	optional int32 recharge_popup = 31;		// (日本版本)充值年龄认证弹窗状态（0.未确认，1.已确认）
	optional int32 server_lang = 32;		// 服务器语言id:1:cn 简体中文  2:CN_TRAD 繁体中文 3:IDN 印度尼西亚 4:en 英文 5:jp 日文 6:kor 韩文 7 vn越南 8 THAI 泰国
	optional bool is_merge = 33;		//是否合服true已合
	optional int32 title = 34;		    //称号id
	optional int32 gender  = 35;	    //性别0男性1女性
}

//修改昵称
//2003
message GReqRoleEditNick
{
	optional string nick = 1;
    optional int32 gender  = 2;	    //性别0男性1女性
    optional string invite_code = 3;//邀请码
}
//2003
message GResRoleEditNick
{
	optional int32 revise_type = 1; // 0：修改成功， 1 为重复， 2 为敏感， 3  推荐码错误或已使用不能创建角色
}

//玩家详细信息
//2004
message GReqPlayerDetaile
{
	optional int64 rid = 1;
	optional int32 server_id = 2;//服务器id
}
//2004
message GResPlayerDetaile
{
	optional int64 player_id = 1;	// 玩家的rid
	optional int32 head_id = 2;		// 头像id
	optional int64 clan_id = 3;		// 军团id
	optional string nick = 4;		// 玩家名字
	optional int32 level = 5;		// 等级
	optional int32 server_id = 6;	// 玩家区号
	optional string clan_name = 7;	// 军团名字
	optional int32 rank = 8;		// pvp分数
	optional int32 fighting = 9;	// 战斗力
	repeated ResHeroBriefData hero_data = 10; // 上阵英雄的信息
	optional int32 border_id = 11;	//头像框id
	optional int32 formation_id = 12;	//阵容ID
	optional bool assistance_unlock = 13;	//援助是否解锁
	optional int32 area_id = 14; 	//区域id,关联到省指定城市
	optional int32 stage_id = 15;	//冠军赛段位
	optional int32 vip = 16;        //VIP等级
	optional int32 gender  = 17;	//性别0男性1女性
}

//新手指引
//2005
message GReqGuideSerial
{
	repeated int32 serial = 1;		//指引的步骤
	repeated string serial_str = 2;	//指引的步骤
}
//2005
