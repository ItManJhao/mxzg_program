message PSMainProcessRecord {
    optional int32 idx = 1;//功能id
    optional int32 use_times = 2;//已经使用次数
    optional int32 total_times = 3;//总次数
    optional int32 state = 4;//状态0可挑战，1可购买，2可报名，3已报名，4已完成
}

// 主城-总览信息
//2032
message GReqMainProcess {
}
//2032
message GResMainProcess {
    repeated PSMainProcessRecord list = 1;//总览信息
}