//GM指令
//2008
message GReqGMCommand
{
	optional int64 gem = 1; 			//需要多少钻石
	optional int64 gold = 2;			//需要多少金币
	repeated PSBackpackData item_list = 3;//需要什么物品
	repeated ResHeroData hero_list = 4;	//英雄类型
}
//2008
