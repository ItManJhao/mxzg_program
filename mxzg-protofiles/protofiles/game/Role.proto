// 与道具配置表ItemID对应
enum RoleAttribute {
    NONE = 0;  // 无
    GOLD        = 900001; // 金币
    GEM         = 900002; // 钻石
    EXP         = 900003; // 经验
    CLAN_EXP    = 900004; // 工会经验
    HERO_EXP    = 900101; // 英雄经验
    LEVEL       = 201; // 等级
    GODDESS_VIP = 202; // Vip等级？
    FIGHTING    = 203; // 布阵英雄战力
}
// 单个属性值
message RoleAttributeValue {
    required RoleAttribute attribute = 1;    // 属性
    optional int64 value             = 2;    // 值
}

//调试指令
//2015
message GReqGMCommandNew {
	required string command = 1; //调试命令
	repeated string param = 2; //参数
}

//2015
message GResGMCommandNew
{
}

