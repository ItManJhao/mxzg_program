// 单个评论分享类型状态
message RoleCommentSharedState {
    optional int32 type     = 1;   // 类型100:app store 评价,200:facebook 点赞,300:facebook 分享
    optional int32 state   = 2;   // 状态0:还没发生,1:已完成,2:已领取
}
//第三方评论点评分享奖励查询
//2021
message GReqCommentSharedState {
}
//2021
message GResCommentSharedState {
    repeated RoleCommentSharedState list = 1; // 评价分享状态
}

//第三方评论点评分享完成
//2022
message GReqCommentSharedComment {
    optional int32 type     = 1;   // 完成类型100:app store 评价,200:facebook 点赞,300:facebook 分享
}
//2022
message GResCommentSharedComment {
    repeated RoleCommentSharedState list = 1; // 评价分享状态
}

