package protocol;
option java_package = "com.ayjs.mxzg.protocol";
option java_outer_classname = "Promotion019GMsg";

message PSLevelUpGiftData
{
	optional int32 idx = 1;// 礼包idx
	optional int32 buyCount = 2;// 剩余
	optional int32 is_obtain = 3;// 0:未领取 1：已领取
}

//等级礼包数量
//13019
message GReqLevelUpGiftList
{
}
//13019
message GResLevelUpGiftList
{
	repeated PSLevelUpGiftData data = 4;
}

//领取等级礼包
//13020
message GReqLevelUpGift
{
	optional int32 gift_id = 1;		//奖励ID
}
//13020
message GResLevelUpGift
{
	optional int32 is_success = 1;	//0:失败 1：成功
	optional int32 idx = 2;			//奖励ID
}