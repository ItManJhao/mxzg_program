//膜拜列表
//11100
message GReqRankWorshipList {
}
//11100
message GResRankWorshipList {
    repeated int32 list = 1;
}

//膜拜
//11101
message GReqRankWorship {
    optional int32 type = 1;
    optional int64 rid = 2;
}
//11101
message GResRankWorship {

}

//11102
message ResRankWorshipOffline{
    repeated ResRankWorshipData list=1;
}


message ResRankWorshipData {
    optional int32 type=1;//1.战力；2.竞技；3.公会；4.幻境；5.地牢；6.点石成金；7.苏战之王；8.试炼之路；9.酒馆常客；10.公会世界BOSS角色积分排行；11.公会世界BOSS公会积分排行
    optional string nick=2;
}

// 排行榜奖励榜单角色信息
message PSRankRoleInfo {
    optional int32 rank = 1; 		    //排名
    optional int64 rid = 2; 		    //玩家ID
    optional string name = 3; 			//玩家名字
    optional int32 level = 4; 			//玩家等级
    optional int32 head_id = 5; 		//玩家头像
    optional int32 border_id = 6;		//头像框id
    optional int32 date_time = 7;		//时间
}
// 排行榜领奖信息
message PSRankRewardInfo {
    optional int32 progress_value = 1;    //进度值
    optional int32 status = 2;            //领取状态0未领1已领
    optional PSRankRoleInfo info = 3;   //玩家信息
}
//排行榜领奖进度信息
//11103
message GReqRankReward {
    optional int32 type = 1;//类型战力1，幻境4，主线关卡15
}
//11103
message GResRankReward {
    repeated PSRankRewardInfo list = 1;// 列表
    optional int32 type = 2;//类型战力1，幻境4，主线关卡15
}

//排行榜领奖前几名信息
//11104
message GReqRankRewardTop {
    optional int32 type = 1;//类型战力1，幻境4，主线关卡15
    optional int32 progress_value = 2;// 进度值
}
//11104
message GResRankRewardTop {
    repeated PSRankRoleInfo info = 3;//玩家信息
}

//排行榜领奖领取
//11105
message GReqRankRewardGet {
    optional int32 type = 1;//类型战力1，幻境4，主线关卡15
    optional int32 progress_value = 2;// 进度值
}
//11105
message GResRankRewardGet {
}

//排行榜是否有进度达成--请求协议暂时不用
//11106
message GResRankProgress {
    optional int32 update = 2;//是否有新的目标达成，1有，0没有
}
