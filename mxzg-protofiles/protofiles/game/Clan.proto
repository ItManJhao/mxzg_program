{
    optional int32 role_level = 1;  //角色等级
    optional bool is_approve = 2;   //是否需要验证
}
//7055
message GResClanJoinRequirement
{
    optional int32 role_level = 1;  //角色等级
    optional bool is_approve = 2;   //是否需要验证
}

