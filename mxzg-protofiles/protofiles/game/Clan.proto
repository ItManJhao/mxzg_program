//7056
message GReqClanRecruit
{
    optional bool is_cost = 1;   //是否需要花费
}
//7056
message GResClanRecruit
{
}

//公会解散
//7057
message GReqClanDissolve
{
}
//7057
message GResClanDissolve
{
}

