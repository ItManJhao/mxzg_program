//工会战，捐献，boss未参与的人员信息
//7062
message GReqClanNotCompleteTask
{
    optional int32 type = 1;   //类型1工会战，2捐献，3公会boss
}
//7062
message GResClanNotCompleteTask
{
    repeated ResClanMemberData list = 1;// 成员列表
}

//公会活跃信息
//7063
message GReqClanLivenessInfo
{
}
//7063
message GResClanLivenessInfo
{
    optional int32 level = 1;//等级
    optional int32 value = 2;//活跃进度
    optional int32 daily_value = 3;//今天活跃进度
    optional int32 week_value = 4;//本周活跃进度
    repeated PSMapData list = 5;// 任务列表idx --> 次数times
}

//公会活跃等级领奖
//7064
message GReqClanLivenessReward
{
    optional int32 level = 1;//升级领奖等级
}
//7064
message GResClanLivenessReward
{
    optional int32 level = 1;//最新等级
    optional int32 value = 2;//活跃进度
}

message PSClanRedPacketSendData
{
	optional int32 type = 1;//红包类型
	optional int32 num = 2;//已发次数
	optional int32 snatch_num = 3;//已抢红包次数
}

message PSClanRedPacketData
{
	optional int64 id = 1;          //红包id
	optional int32 buy_gem_id = 2;   //红包商品id
	optional int32 snatch_times = 3;  //已抢次数
	optional int64 rid = 4;         //发红包角色id
    optional string nick = 5;       //发红包角色名
    optional int32 photo = 6;       //头像
    optional int32 border_id = 7;   //头像框
    optional int32 date_time = 8;  //时间
    optional int32 state = 9;       //状态，0未领取，1已领取
    optional int32 position = 10;   // 0：无效，1：会长；2：副会长 3：普通成员
    optional int32 level = 11;      // 角色等级
}

message PSClanRedPacketRecord
{
	optional int64 rid = 1;         //抢红包角色id
    optional string nick = 2;       //抢红包角色名
    optional int32 photo = 3;       //头像
    optional int32 border_id = 4;   //头像框
	optional int32 item_id = 5;     //抢到货币类型
	optional int32 snatch_num = 6;  //抢到金额
	optional int32 date_time = 7;   //时间
}
message PSClanRedPacketRankInfo
{
	optional int64 rid = 1;         //抢红包角色id
    optional string nick = 2;       //抢红包角色名
    optional int32 photo = 3;       //头像
    optional int32 border_id = 4;   //头像框
	optional int32 rank = 5;        //排名
	optional int32 send_money = 6;  //发送总价值
	optional int32 send_times = 7;  //发送红包数量
	optional int32 level = 8;       //角色等级
}

//公会已发送的红包信息
//7071
message GReqClanRedPacketSendInfo
{
}
//7071
message GResClanRedPacketSendInfo
{
    repeated PSClanRedPacketSendData list = 1;// 红包信息
}

//公会红包列表
//7072
message GReqClanRedPacket
{
}
//7072
message GResClanRedPacket
{
    repeated PSClanRedPacketData list = 1;// 红包信息
}

//抢红包
//7073
message GReqClanSnatchRedPacket
{
    optional int64 id = 1;   //红包id
}
//7073
message GResClanSnatchRedPacket
{
    repeated PSClanRedPacketRecord list = 1;// 红包被抢记录
}

//单个红包详情
//7074
message GReqClanRedPacketDetail
{
    optional int64 id = 1;   //红包id
}
//7074
message GResClanRedPacketDetail
{
    repeated PSClanRedPacketRecord list = 1;// 红包被抢记录
}

//红包排名
//7075
message GReqClanRedPacketRank
{
}
//7075
message GResClanRedPacketRank
{
    repeated PSClanRedPacketRankInfo list = 1;// 红包排名
}