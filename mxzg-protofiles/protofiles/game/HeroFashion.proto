package protocol;
option java_package = "com.ayjs.mxzg.protocol";
option java_outer_classname = "HeroFashionGMsg";

//
message PSHeroFashion{
    optional int64 hero_id = 1;//英雄id
    optional int32 fashion_id = 2;//皮肤id
}
//皮肤data
message PSFashionData{
    optional int32 hero_type = 1;//英雄类型
    optional int32 fashion_id = 2;
    optional int32 level = 3;
    optional int32 status = 4;//激活状态，1为期限，0为永久
    optional int32 end_time = 5;//期限皮肤到期时间（永久激活结束时间为0）
}

//获取穿戴皮肤的英雄列表
//4401
message GReqHeroFashion{

}
//4401
message GResHeroFashion{
    repeated PSHeroFashion list = 1;
}

//获取激活的皮肤列表
//4402
message GReqHeroFashionList{
}
//4402
message GResHeroFashionList{
    repeated PSFashionData list = 2;
}

//激活皮肤
//4403
message GReqActiveHeroFashion{
    optional int32 item_type = 1;//道具id
}
//4403
message GResActiveHeroFashion{
    optional int32 fashion_id = 1;//解锁皮肤idx
}

//替换或使用皮肤
//4404
message GReqHeroFashionChange{
    optional int64 hero_id = 1;//英雄id
    optional int32 fashion_id = 2;//皮肤id
}
//4404
message GResHeroFashionChange{
    optional int64 hero_id = 1;//英雄id
    optional int32 fashion_id = 2;//皮肤id
}

//皮肤升级
//4405
message GReqHeroFashionUp{
    optional int32 fashion_id = 1;
}
//4405
message GResHeroFashionUp{
    optional int32 fashion_id = 1;
    optional int32 level = 2;
}
