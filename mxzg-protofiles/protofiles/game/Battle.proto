message PSPassReportRecord
{
    optional int32 type = 1; 	        //类型：1最近,2最快,3最低战力
    optional int64 rid = 2; 		    //玩家ID
    optional string name = 3; 	        //玩家名字
    optional int32 head_id = 4; 	    //玩家头像
    optional int32 border_id = 5;		//头像框id
    optional int32 complete_time = 6; 	//通关时间
    optional int32 fighting = 7; 	//通关战力
    optional string report_id = 8; 		//战报id
}
