package protocol;
option java_package = "com.ayjs.mxzg.protocol";
option java_outer_classname = "BattleGMsg";

import "Hero.proto";
import "Clan.proto";
import "Fetter.proto";
import "Object.proto";

message PSPlayerBattleData
{
	optional int32 idx = 1;
	repeated ResHeroData enemy_list = 2; // 对手数据
	repeated PSHeroEquipData equip_list = 3;
	repeated PSClanSkillData enemy_clan = 4;
	optional PSFetterData enemy_fetter = 5;
}

message PSLineUpHeroData
{
	optional int64 hero_id = 1;	//英雄ID
	optional int32 hp = 2;		//剩余血量
	optional int32 position = 3;//位置 9标识该英雄为助阵英雄
}

message PSLineUpData
{
	optional int32 type = 1;  // 布阵类型   0：主线战斗 1:幻境之塔 2：地牢 3：试炼 4：PVP防守  5： 工会BOSS
	optional int32 time = 2; // 布阵的时间
	optional int32 goddess_type = 3;//神器类型
	repeated PSLineUpHeroData hero_list = 4;
	optional int32 formation_id = 5;	//阵法id
}

message PSItemData
{
	optional int64 rid = 1;//奖励者ID
	optional int32 type = 2;//道具类型
	optional int32 num = 3;//数量
}

// 战场对战单位
message BattlerUnit 
{
	optional int64 player_id = 1;	//玩家id如果是pve则这里是怪物id
	optional string name = 2;		//玩家名称
	optional GoddessUnit goddess = 3;	//女神
	repeated HeroUnit heros = 4;	//英雄列表
	optional int32 formation_id = 5;	// 阵法id
	optional DragonUnit dragon = 6;	//圣龙
}

// 战场英雄单位
message HeroUnit
{
	optional int32 unit_id = 1; //单位id
	optional int32 hero_id = 2; //英雄id
	optional int32 level = 3; //等级
	optional int32 star = 4; //星级
	optional int32 element = 5; //元素
	optional int32 position = 6; //位置
	optional int64 hp = 7; //血量
	optional int64 max_hp = 8; //最大血量
	optional int32 energy = 9; //能量
	optional int32 max_energy = 10; //最大能量
	optional int32 status = 11; //状态 0 - 存活 1 - 死亡 2-隐藏
    optional int64 id = 12; //主键id npc则该值为-1
	optional int32 fashion_id = 13;	//皮肤id
	optional PSHeroEvolve evolve=14;//进化
}

// 女神
message GoddessUnit
{
	optional int32 unit_id = 1;	//单位id	
	optional int32 goddess_id = 2;	//羁绊女神id
	optional int32 energy = 3;	//能量
	optional int32 max_energy = 4;	//最大能量
	optional int32 uplimit_level = 5;	// 突破等级
	optional int32 fashion_id = 6;			//皮肤id
}

// 圣龙
message DragonUnit
{
	optional int32 unit_id = 1;	//单位id
	optional int32 dragonId = 2;	// 神龙主键id
	repeated int32 skillId = 3;	// 技能列表
}

// 战斗日志
message BattleLog {
	optional BattlerFightLog attacker_log = 1; //攻方日志
	optional BattlerFightLog defender_log = 2; //守方日志
	optional int64 win_id = 3; //胜利方id
	optional string battleId = 4; //战斗id
	optional int32 battle_duration = 5;	//战斗时长（ms）
	optional int32 round = 6;	    //战斗回合数
}

// Battler战斗日志
message BattlerFightLog {
	optional int64 rid = 1;			//角色ID
	optional string name = 2;		//角色名
    repeated HeroLog hero_log = 3;	//英雄战斗日志
	optional int32 border_id = 4;	//角色头像框
	optional int32 fighting = 5;	//战斗力
	optional int32 serverId = 6;	//服务器ID
	optional int32 level = 7;		//角色等级
	optional int32 head_id = 8;		//角色头像
	optional int32 formation_id = 9;//阵型ID
	repeated PSTuple2Data buff_stat = 10;//指定buff统计(伤害或者触发次数)
}

// 英雄战斗日志
message HeroLog {
	optional int64 hero_id = 1;				//主键id
	optional int64 total_damage = 2;		//总伤害
	optional int64 total_take_damage = 3;	//总承受伤害
	optional int64 total_recovery = 4;		//总治疗
	optional int32 star = 5;				//星级
	optional int32 level = 6;				//等级
	optional int32 hero_type = 7;			//英雄类型
    optional int32 position = 8;			//英雄位置
	optional int32 fashion_id = 9;			//皮肤id
	optional PSHeroEvolve evolve=10;//进化
	optional int64 hp = 11;	//当前血量
	optional int64 max_hp = 12;	//最大血量
}

// 战斗回合
message CombatRound
{
	optional int32 round = 1;		//回合从1开始
	repeated BuffInfo buffInfo = 2;	// 出手前的buff列表
	repeated GoddessAttack goddess_attack = 3;	//女神攻击信息
	repeated AttackInfo attack_info = 4;	//英雄攻击信息
	repeated BuffInfo afterRoundBuffs = 5;	// 出手后的buff效果列表
	repeated DragonAttack dragon_attack = 6;	//圣物攻击信息

}

// 女神攻击信息
message GoddessAttack
{
	optional int32 unit_id =1;	//出手的女神单位id
	optional int32 energy = 2;	//本回合增加的能量
	optional AttackInfo attackInfo = 3;	//女神出手信息
}

// 圣龙攻击信息
message DragonAttack
{
	optional int32 unit_id = 1;	// 出手的神龙id
	optional AttackInfo attackInfo = 2;	//女神出手信息
	optional int32 next_attack_round = 3;	//下次攻击的回合数
}

// 进攻信息
message AttackInfo
{
	optional int32 unit_id = 1;	// 出手的英雄id
	optional Skill skill = 2;	// 使用的技能
	optional int32 skill_type = 3; // 1技能 2 普攻
}


// 技能信息
message Skill 
{
	optional int32 skill_id = 1;		//技能id
	repeated EffectInfo effect_info = 2;	//技能效果列表
	optional int32 energyUpdate = 3;	//能量修改 大于0则为增加，小于0则为减少
}

// 技能效果列表
message EffectInfo 
{
	optional int32 buff_id = 1;		//buffId
	repeated BuffInfo buff_info = 2;	//buff效果列表
}

// buff信息
message BuffInfo
{
	required int32 unit_id = 1;	// buff单位id
	required int32 target_unitId = 2;	//buff所属英雄的单位id
	required int32 buff_id = 3;	//buffId
	optional int32 expired_round = 4;	//过期回合
	optional int32 hit = 5;		// 命中 0 未命中 1 命中 2暴击, 3斩杀, 4格挡
	optional int32 status = 6;	// 状态变化 0 - 存活 1 - 死亡 2-进场
	repeated AttributeUpdate update = 7;// 属性变化列表
	repeated int32 resistances = 8;		// 1、有小熊分担伤害
}


// 属性变更信息
message AttributeUpdate
{
	optional int32 type = 1;	//属性类型
	optional int64 value = 2;	//属性值
}


// 战报
message BattleReport
{
	optional string battle_id = 1; //战斗ID
	optional int32 battle_type = 2; //战斗类型
	optional BattlerUnit attacker = 3; //攻方
	optional BattlerUnit defender = 4; //守方
	repeated CombatRound rounds = 5; //战斗回合信息
	optional int64 win_id = 6; //胜利方的单位id
	optional int64 start_time = 7; //战斗开始时间
    optional BattleLog log = 8; //战斗日志
}


//战斗测试
//3000
message GReqBattleTest
{
	optional int32 type = 1;	//类型
}
//测试返回
//3000
message GResBattleTest
{
	optional BattleReport report = 1;	// 战报
}



//战斗
//3001
message GReqBattleMatch
{
}
//3001
message GResBattleMatch
{
	optional BattleReport report = 1;	// 战报
}

