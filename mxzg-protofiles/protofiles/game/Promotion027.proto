package protocol;
option java_package = "com.ayjs.mxzg.protocol";
option java_outer_classname = "Promotion027GMsg";
import "Pvp.proto";
import "Object.proto";

//查看试炼之路信息
//13381
message GReqAdventureCountData
{
}
//13381
message GResAdventureCountData
{
	optional int32 count = 1;	//次数
	repeated PSMapData list = 2;	//已领取奖励信息
}

//领取试炼之路奖励
//13382
message GReqGetAdventureReward
{
	optional int32 idx = 1;	//奖励ID
}
//13382
message GResGetAdventureReward
{
	optional int32 idx = 1;	//奖励ID
}

//查看试炼之路排行榜
//13383
message GReqScanAdventureRank
{
	
}
//13383
message GResScanAdventureRank
{
	optional int32 my_rank = 1;			//我的排名，0未进榜
	repeated PSRankPlayerData list = 2;	//排行榜
}
