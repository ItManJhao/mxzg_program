package protocol;
option java_package = "com.ayjs.mxzg.protocol";
option java_outer_classname = "Promotion057GMsg";
import "Object.proto";

//每日登陆数据
//13200
message GReqEveryDayLoginPromotion {
}
//13200
message GResEveryDayLoginPromotion {
    optional int32 day_turns = 1; //任务轮次
    repeated PSMapData task_list = 2; //任务进度
    repeated int32 idx = 3; //已领取的任务奖励集
}

//领取每日登陆奖励
//13201
message GReqEveryDayLoginReward{
    optional int32 idx = 1;
}
//13201
message GResEveryDayLoginReward{
    repeated int32 idx = 1; //已领取的任务奖励集
}

//推送目标进度更新
//13202
message GResUpdateEveryDayLoginTarget {
    repeated PSMapData update_tasks = 1; //任务更新
}



