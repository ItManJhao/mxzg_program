package protocol;
option java_package = "com.ayjs.mxzg.protocol";
option java_outer_classname = "Promotion050GMsg";


//礼包信息
//53001
message GReqFestivalOvervalueGift{
}
//53001
message GResFestivalOvervalueGift{
    optional int32 day = 1;//活动当前进行多少天
    optional int32 receive_day = 2;//超值礼包已领取天数
    repeated int32 idx = 3;//已购买的礼包idx,对应配置表的idx
}

//领取超值礼包奖励
//53002
message GReqFestivalGiftReceive{
    optional int32 idx = 1;//领取的礼包idx
}
//53002
message GResFestivalGiftReceive{
    optional int32 idx = 1;
    optional int32 receive_day = 2;//已领取天数
}

//跨天在线更新超值礼包可领取天数
//53003
message GResFestivalReceiveDay{
    optional int32 day = 1;//累登天数
}