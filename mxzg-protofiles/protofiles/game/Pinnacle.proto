//玩家的竞猜列表
//72311
message GReqPinnacleGuessList
{
}
//72311
message GResPinnacleGuessList
{
	repeated PSPinnacleGuess record = 1;	//竞猜记录
}

//竞猜比赛中奖推送
//72312
message GResPinnacleGuessWin
{
	optional int32 period = 1;			//比赛进程
	optional int32 battle_round = 2;	//比赛回合
	optional int64 gain_coin = 3;		//获得的竞猜币数量
}

//请求我的比赛列表
//72313
message GReqScanMyPinnacleBattle
{
}
//72313
message GResScanMyPinnacleBattle
{
	repeated PSPinnacleBattle battles = 1;	//比赛列表
}

//巅峰赛阶段变化的推送
//72314
message GResPinnacleStageChange
{
}

