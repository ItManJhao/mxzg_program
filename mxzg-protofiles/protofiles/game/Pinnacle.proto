message GReqPinnacleBiubiu
{
	optional string content = 1;
}
//72308
message GResPinnacleBiubiu
{
	optional int32 biu_cd = 1;		//发弹幕冷却时间
}

//请求弹幕列表
//72309
message GReqPinnacleBiuList
{
}
//72309
message GResPinnacleBiuList
