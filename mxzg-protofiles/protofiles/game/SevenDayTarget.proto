package protocol;
option java_package = "com.ayjs.mxzg.protocol";
option java_outer_classname = "SevenDayTargetGMsg";
import "Achievement.proto";

message PSSevenDayData {
    optional int32 idx = 1;
    optional int32 num = 2;
    optional int32 day = 3;
}

message PSSevenDayBox {
    optional int32 idx = 1;
    optional int32 status = 2;
}

message PSSevenDayStatus {
    optional int32 idx = 1;
    optional int32 status = 2;
}

