//---------------------新版-----------------------------

//七日目标列表
//21010
message GReqSevenDayTargetList {

}
//21010
message GResSevenDayTargetList {
    repeated PSTaskData task = 1; //任务列表
    repeated int32 reward_box_idx = 2; //宝箱领奖记录
    required int32 seven_day_value = 3; //七日目标值
    required int32 curr_day = 4; //当前天数
}

//七日目标任务领奖
//21011
message GReqSevenDayTargetGetReward {
    required int32 task_id = 1;
}
//21011
message GResSevenDayTargetGetReward {
    required int32 seven_day_value = 1;
    repeated PSTaskData task = 2;
}
//宝箱领奖
//21012
message GReqSevenDayTargetBoxGetReward {
    required int32 box_id = 1;
}
//21012
message GResSevenDayTargetBoxGetReward {
    optional int32 box_id = 1;
}

//推送目标进度更新
//21013
message GResUpdateSevenDayTarget {
    repeated PSTaskData update_tasks = 1; //
}
