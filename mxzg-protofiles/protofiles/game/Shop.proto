package protocol;
option java_package = "com.ayjs.mxzg.protocol";
option java_outer_classname = "ShopGMsg";

//50000
message GResShopList {
    repeated ResShopInfo list = 1; // 单个店铺所有商品信息
}

//50001
message GReqShopRefresh {
    optional int32 type = 1;
}
//50001
message GResShopRefresh {
    optional int32 type = 1; //商店ID
    optional int32 operat = 2; // 0免费，1付费
    optional int32 refresh_num = 3; // 刷新次数
    optional int32 last_free_time = 4; // 上次免费时间
    optional int32 free_count = 5; // 免费次数
}

//50002
message GReqShopBuy {
    optional int32 type = 1;
    optional int32 idx = 2;
    optional int32 buy_times= 3;// 购买数量
}
//50002
message GResShopBuy {
    optional int32 type = 1; //商店ID
    optional int32 idx = 2; //  物品
    optional int32 buy_num = 3; // 物品购买数量
}

//50004
message GResOneShopData {
    repeated ResShopInfo list = 1; // 单个店铺所有商品信息
}

message ResShopInfo {
    optional int32 type = 1; // 商店类型
    optional int32 free_refresh_num = 2; // 免费刷新次数
    optional int32 charge_refresh_num = 3; // 收费刷新次数
    optional string charge_item_cost = 4; // 刷新使用物品
    repeated ResShopItem item = 5; // 商店商品
    optional int32 last_free_time = 6; // 上次免费时间
    optional int32 curr_free_num = 7; // 当前已经使用的免费次数
}
message ResShopItem {
    optional int32 idx = 1; // 商品ID
    optional int32 buy_num = 2; // 已购买数量
}

//获得免费次数
//50005
message GReqGetFreeNum {
    optional int32 type = 1; //商店ID

}

//50005
message GResGetFreeNum {
    optional int32 type = 1; //商店ID
    optional int32 free_refresh_num = 2; //  可使用的免费次数
    optional int32 last_free_time = 3; // 上次免费时间
}


